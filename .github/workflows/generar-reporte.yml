name: Generar reporte mensual

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generar-reporte
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install reportlab svglib

      - name: Extraer datos del Sheet
        id: extract
        run: |
          cd scripts/reportes
          if ! node extract_data.js ../../index.html real_data.json; then
            echo "Sin acceso al Sheet o sin datos -- no hay nada para generar esta corrida."
            echo "ok=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=si" >> "$GITHUB_OUTPUT"

      - name: Detectar mes pendiente
        id: detectar
        if: steps.extract.outputs.ok == 'si'
        run: |
          cd scripts/reportes
          PENDIENTE=$(node mes_pendiente.js real_data.json ../../index.html)
          echo "pendiente=$PENDIENTE" >> "$GITHUB_OUTPUT"
          if [ -z "$PENDIENTE" ]; then
            echo "No hay mes pendiente -- el Sheet todavía no tiene un mes nuevo sin reporte."
          else
            echo "Mes pendiente: $PENDIENTE"
          fi

      - name: Generar reportes (consolidado + 4 áreas) y registrarlos
        id: generar
        if: steps.detectar.outputs.pendiente != ''
        run: |
          cd scripts/reportes
          ARCHIVOS=$(node generar_reportes.js "$PENDIENTE" real_data.json ../../index.html)
          echo "$ARCHIVOS"
          MES=$(node -e "console.log(JSON.parse(process.env.PENDIENTE).mes)")
          {
            echo "mes=$MES"
            echo "archivos<<EOF_ARCHIVOS"
            echo "$ARCHIVOS"
            echo "EOF_ARCHIVOS"
          } >> "$GITHUB_OUTPUT"
        env:
          PENDIENTE: ${{ steps.detectar.outputs.pendiente }}

      - name: Commitear y subir a main
        if: steps.detectar.outputs.pendiente != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$ARCHIVOS" | xargs git add
          git commit -m "Generar reporte automático de $MES 2026 (consolidado + áreas)"
          git push origin HEAD:main
        env:
          ARCHIVOS: ${{ steps.generar.outputs.archivos }}
          MES: ${{ steps.generar.outputs.mes }}
