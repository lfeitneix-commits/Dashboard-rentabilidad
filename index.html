function buildDetalleTable(mesF,tipoF,areaF,searchQ){
  const d=mesF==='__consolidado__'?getConsolidadoDetalle():ST.mesData[mesF];
  if(!d){
    const t=document.getElementById('det-thead');const b=document.getElementById('det-tbody');
    if(t)t.innerHTML='<tr><td>Sin datos</td></tr>';
    if(b)b.innerHTML='';
    return{theadHTML:'',tbodyHTML:''};
  }
  const rows=d.annotated;
  const showAreas=areaF&&areaF!=='Todas las áreas'?[areaF]:AREAS;
  const notesCol=d.notesCol;
  const isConsolidado=mesF==='__consolidado__';
  const tipoMap={'Facturación':'ing','Gastos directos':'dir','Gastos indirectos':'ind'};
  const tipoFilter=tipoF&&tipoF!=='Todos los tipos'?tipoMap[tipoF]:null;
  const q=searchQ?searchQ.toLowerCase().trim():'';
  const searchMode=!!q;
  const DIST_ACCOUNTS=['gastos corresp. ext','página web','publicidad','merchandising','merchandasing'];
  // En consolidado: si la nota es la misma en todos los meses que la
  // tienen, mostrarla una sola vez. Si cambia mes a mes (ej. "Viajes",
  // donde cada mes es un viaje distinto), no mostrar nada — listar todas
  // amontona demasiado texto en la celda.
  const getConsNote=row=>{
    if(!isConsolidado) return row._allNotes||row._note||'';
    const notas=new Set();
    for(const m of ST.meses){
      const md=ST.mesData[m];
      if(!md) continue;
      const r=md.annotated.find(r=>r._nom===row._nom);
      const n=r&&(r._allNotes||r._note);
      if(n) notas.add(n);
    }
    return notas.size===1?[...notas][0]:'';
  };
  const getNote=row=>{
    if(row._note&&row._note.trim()) return row._note.trim();
    const noteKey=Object.keys(row).find(k=>/nota/i.test(k));
    return noteKey?(row[noteKey]||'').trim():'';
  };
  // Show asterisk on these 3 accounts always, regardless of note content
  const hasDist=row=>DIST_ACCOUNTS.some(n=>(row._nom||'').toLowerCase().includes(n));
  const getDistNote=row=>{
    const n=getNote(row);
    return n||'Ver distribución en Matriz de gastos';
  };

  // Pre-process: reorder rows so subsection headers appear BEFORE their items
  // Current CSV order: items → subsection closing row
  // Desired display order: subsection header → items → (next subsection header → items...)
  // Strategy: group items between subsection markers, then output header first
  
  // Build display groups within each main section
  // A "group" is: [subsectionRow?, ...itemRows]
  // We'll reorganize so subsection row comes first
  
  // First collect all rows respecting section boundaries
  const displayRows = [];
  let i = 0;
  while(i < rows.length){
    const row = rows[i];
    if(row._kind === 'skip'){ i++; continue; }
    if(row._kind === 'section'){
      displayRows.push(row);
      i++;
      // Collect everything until next main section, reordering subsections to come first
      let j = i;
      while(j < rows.length && rows[j]._kind !== 'section'){
        if(rows[j]._kind === 'skip'){ j++; continue; }
        if(rows[j]._kind === 'subsection'){
          // Find start of this subsection's items (go back to find items since last subsection/section)
          // Items between previous marker and this subsection → they belong to this subsection
          // They're already in displayRows — we need to insert the subsection header BEFORE them
          // So: collect items forward until next subsection, output subsection header first
          const subsecRow = rows[j];
          const subsecItems = [];
          j++;
          while(j < rows.length && rows[j]._kind !== 'subsection' && rows[j]._kind !== 'section' && rows[j]._kind !== 'skip'){
            subsecItems.push(rows[j]);
            j++;
          }
          // The items BEFORE this subsection (already processed) belong to it
          // We need to look BACK in displayRows and move them after the subsection header
          // Simpler: just insert subsection + following items
          displayRows.push(subsecRow);
          subsecItems.forEach(r => displayRows.push(r));
        } else {
          displayRows.push(rows[j]);
          j++;
        }
      }
      i = j;
    } else {
      displayRows.push(row);
      i++;
    }
  }

  // But the items BEFORE the first subsection (belonging to it) were already added to displayRows
  // before the subsection header. We need a cleaner approach.
  // Let's redo: for each main section, collect all its content and regroup properly.
  
  const finalRows = [];
  let k = 0;
  while(k < rows.length){
    const row = rows[k];
    if(row._kind === 'skip'){ k++; continue; }
    if(row._kind !== 'section'){ finalRows.push(row); k++; continue; }
    
    // Main section row
    finalRows.push(row);
    k++;
    
    // Collect all content of this section until next main section
    const sectionContent = [];
    while(k < rows.length && rows[k]._kind !== 'section'){
      if(rows[k]._kind !== 'skip') sectionContent.push(rows[k]);
      k++;
    }
    
    // Group sectionContent into subsection groups
    // Format: [...items, subsectionClosing, ...items, subsectionClosing, ...]
    // Reorder to: [subsectionClosing(as header), ...items, subsectionClosing(as header), ...items]
    const groups = []; // [{subsec: row|null, items: []}]
    let currentItems = [];
    sectionContent.forEach(r => {
      if(r._kind === 'subsection'){
        groups.push({subsec: r, items: currentItems});
        currentItems = [];
      } else {
        currentItems.push(r);
      }
    });
    if(currentItems.length) groups.push({subsec: null, items: currentItems});
    
    // Add groups to finalRows: subsec header first, then items
    groups.forEach(g => {
      if(g.subsec) finalRows.push(g.subsec);
      g.items.forEach(r => finalRows.push(r));
    });
  }

    const showNumCol=!!d.numCol;
    let html=`<div style="overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 210px)"><table style="width:100%">
    <thead><tr>
      ${showNumCol?`<th style="width:70px">N° Cta</th>`:''}
      <th>Nombre de cuenta</th>
      ${showAreas.map(a=>`<th class="r" style="min-width:110px">${a}</th>`).join('')}
      <th class="r" style="min-width:100px;border-left:1px solid var(--border)">Total USD</th>
      ${notesCol?`<th style="min-width:80px;max-width:120px">Notas</th>`:''}
    </tr></thead><tbody>`;

  // Fila de pie (resultado / impuestos / gastos totales) — nombre y
  // valores vienen tal cual del sheet.
  function renderFooterRow(r,style){
    const vals=showAreas.map(a=>getAreaVal(r,a));
    const tot=AREAS.reduce((s,a)=>showAreas.includes(a)?s+getAreaVal(r,a):s,0);
    const label=r._nom||'';
    if(style==='section'){
      return`<tr class="row-section">
        ${showNumCol?'<td></td>':''}
        <td>${r._nom}</td>
        ${vals.map(v=>`<td class="r">${fmtGasto(v)}</td>`).join('')}
        <td class="r" style="border-left:1px solid var(--border)">${fmtGasto(tot)}</td>
        ${notesCol?`<td class="note-cell">${getConsNote(r)}</td>`:''}
      </tr>`;
    }
    let trStyle,labelStyle,valStyle;
    if(style==='verde'){
      trStyle='background:rgba(0,72,54,.05);border-top:2px solid rgba(0,72,54,.15)';
      labelStyle='font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde)';
      valStyle=(v)=>`font-weight:700;font-family:'DM Mono',monospace;font-size:11px;color:${v>=0?'var(--verde)':'var(--bordeaux)'}`;
    } else if(style==='verde-dark'){
      trStyle='background:rgba(0,72,54,.09);border-top:2px solid rgba(0,72,54,.25)';
      labelStyle='font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde)';
      valStyle=(v)=>`font-weight:700;font-family:'DM Mono',monospace;font-size:11px;color:${v>=0?'var(--verde)':'var(--bordeaux)'}`;
    } else {
      trStyle='background:rgba(171,25,48,.06);border-top:1px solid rgba(171,25,48,.2)';
      labelStyle='font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--bordeaux)';
      valStyle=()=>`font-weight:700;font-family:'DM Mono',monospace;font-size:11px;color:var(--bordeaux)`;
    }
    const fmtVal=style==='bordeaux'||!['verde','verde-dark'].includes(style)?fmtGasto:(v=>fmtD(v));
    return`<tr style="${trStyle}">
      ${showNumCol?'<td></td>':''}
      <td style="${labelStyle}">${label}</td>
      ${vals.map(v=>`<td class="r" style="${valStyle(v)}">${fmtVal(v)}</td>`).join('')}
      <td class="r" style="${valStyle(tot)};border-left:1px solid var(--border)">${fmtVal(tot)}</td>
      ${notesCol?`<td class="note-cell">${getConsNote(r)}</td>`:''}
    </tr>`;
  }

  // Para un líder de área todavía no se muestran los indirectos (la
  // asignación por área no está definida) -- se ocultan sin importar qué
  // tipo esté elegido en el filtro.
  const ocultarIndirectos=ST.role==='lideres';
  let sectionVisible=!tipoFilter;
  let currentSecId=null;
  let currentSecTipo=null;
  let currentSubId=null;

  finalRows.forEach(row=>{
    if(!row||row._kind==='skip')return;

    // ── MAIN SECTION ──
    if(row._kind==='section'){
      sectionVisible=(!tipoFilter||row._tipo===tipoFilter)&&!(ocultarIndirectos&&row._tipo==='ind');
      if(!sectionVisible)return;
      currentSecId='sec-'+row._seclabel.replace(/[^a-zA-Z0-9]/g,'');
      currentSecTipo=row._tipo;
      currentSubId=null;
      if(searchMode)return;
      const sVals=showAreas.map(a=>getAreaVal(row,a));
      const sTot=AREAS.reduce((s,a)=>showAreas.includes(a)?s+getAreaVal(row,a):s,0);
      const isFact=row._tipo==='ing';
      if(isFact){
        html+=`<tr class="row-section row-section-fact" style="cursor:default">
          ${showNumCol?'<td></td>':''}
          <td style="font-weight:700">${row._seclabel}</td>
          ${sVals.map(v=>`<td class="r">${v?fmtD(v):'—'}</td>`).join('')}
          <td class="r">${sTot?fmtD(sTot):'—'}</td>
          ${notesCol&&!(ST.role==='lideres'&&ST.area!=='Mesa')?`<td class="note-cell">${getConsNote(row)}</td>`:notesCol?'<td class="note-cell"></td>':''}
        </tr>`;
      } else {
        const secIsOpen=ST.expandedSecs.has(currentSecId);
        html+=`<tr class="row-section${secIsOpen?' sec-open':''}" data-secid="${currentSecId}" onclick="toggleSection('${currentSecId}',this)">
          ${showNumCol?'<td></td>':''}
          <td><span class="sec-toggle">▶</span>${row._seclabel}</td>
          ${sVals.map(v=>`<td class="r">${fmtGasto(v)}</td>`).join('')}
          <td class="r">${fmtGasto(sTot)}</td>
          ${notesCol?`<td class="note-cell">${isConsolidado?getConsNote(row):row._note||''}</td>`:''}
        </tr>`;
      }
      return;
    }

    // ── SUBTOTAL DIRECTOS — inline entre secciones, mismo estilo que las
    // filas de Resultado (línea superior + verde/bordeaux según signo) ──
    if(row._kind==='subtotal_dir'){
      if(!tipoFilter&&!q){
        html+=renderFooterRow({...row,_nom:'RESULTADO SUBTOTAL DIRECTOS'},'verde');
      }
      return;
    }

    if(!sectionVisible)return;

    // ── SUBSECTION (now rendered as header before its items) ──
    if(row._kind==='subsection'){
      if(searchMode)return;
      currentSubId='sub-'+row._seclabel.replace(/[^a-zA-Z0-9]/g,'');
      const sVals=showAreas.map(a=>getAreaVal(row,a));
      const sTot=AREAS.reduce((s,a)=>showAreas.includes(a)?s+getAreaVal(row,a):s,0);
      const isImpuestos=/^IMPUESTOS?$/i.test(row._seclabel);
      const secExpanded=currentSecId&&ST.expandedSecs.has(currentSecId);
      const subIsOpen=ST.expandedSubs.has(currentSubId);
      const subHidden=secExpanded?'':' style="display:none"';
      html+=`<tr class="row-subtotal${currentSecId?' sec-child-'+currentSecId:''}${subIsOpen?' sec-open':''}"${row._noToggle?'':` data-subid="${currentSubId}" onclick="toggleSubsection('${currentSubId}',this)"`}${subHidden}>
        ${showNumCol?'<td></td>':''}
        <td>${row._noToggle?'':'<span class="subsec-toggle">▶</span>'}${row._seclabel}${isImpuestos?`<span class="dist-badge" data-tip="Ver distribución en Matriz de gastos">✦</span>`:''}</td>
        ${sVals.map(v=>`<td class="r">${fmtGasto(v)}</td>`).join('')}
        <td class="r">${fmtGasto(sTot)}</td>
        ${notesCol?`<td class="note-cell">${isConsolidado?getConsNote(row):row._note||''}</td>`:''}
      </tr>`;
      return;
    }

    // ── ACCOUNT ROWS ──
    if(ST.role==='lideres'&&ST.area!=='Mesa'&&CUENTAS_OCULTAS_NO_MESA.includes(row._nom.trim()))return;
    if(ST.role==='lideres'&&row._child&&PARENTS_SIN_DESPLEGABLE_LIDERES.has(CHILD_TO_PARENT[row._nom])){
      const permiteSplitFAsMza=ST.area==='FAs'&&MZA_SPLIT_PARENTS.has(CHILD_TO_PARENT[row._nom]);
      const esHijoFAsOMza=permiteSplitFAsMza&&/ (FAs|Mza)$/.test(row._nom.trim());
      if(!esHijoFAsOMza) return;
    }
    if(row._child&&PARENTS_SIN_DESPLEGABLE.has(CHILD_TO_PARENT[row._nom]))return;
    if(q){
      const haystack=(row._nom+' '+(row._num||'')).toLowerCase();
      if(!haystack.includes(q))return;
    }

    const vals=showAreas.map(a=>getAreaVal(row,a));
    const tot=vals.reduce((s,v)=>s+v,0);
    const secClass=currentSecId?`sec-child-${currentSecId}`:'';
    const subClass=currentSubId?`sub-child-${currentSubId}`:'';
    // Visibilidad: oculto por defecto, visible si la sección está expandida.
    // La sección de Facturación (ing) no tiene toggle propio — sus cuentas
    // (ej. Ingresos Varios) se muestran siempre, sin necesidad de expandir.
    const secExpanded=!currentSecId||currentSecTipo==='ing'||ST.expandedSecs.has(currentSecId);
    const subExpanded=!currentSubId||ST.expandedSubs.has(currentSubId);
    const parentVisible=searchMode||(secExpanded&&subExpanded);
    const hiddenStyle=parentVisible?'':' style="display:none"';

    const isMuted=row._muted||/ya\s+descontado|incluido\s+fac\.?\s*mesa/i.test(getConsNote(row)||row._allNotes||row._note||'');
    const flattenParent=(ST.role==='lideres'&&PARENTS_SIN_DESPLEGABLE_LIDERES.has(row._nom)&&!(ST.area==='FAs'&&MZA_SPLIT_PARENTS.has(row._nom)))||PARENTS_SIN_DESPLEGABLE.has(row._nom);
    const notaMostrar=notaLiderSegura(row,rows,isConsolidado,mesF);

    if((row._kind==='account'||row._kind==='subaccount')&&row._parent&&!flattenParent){
      const parentOpen=ST.expandedRows.has(row._parentId);
      html+=`<tr class="row-parent ${secClass} ${subClass}${parentOpen?' open':''}"${hiddenStyle} data-pid="${row._parentId}" onclick="toggleParent('${row._parentId}',this)" style="${isMuted?'color:#9A8E7D;font-style:italic':''}">
        ${showNumCol?`<td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${row._num}</td>`:''}
        <td><div class="name-wrap"><span class="toggle-icon">▶</span>${row._nom}${searchMode&&row._tipo?` <span style="font-size:9px;font-weight:500;color:var(--muted);font-family:'DM Mono',monospace;opacity:.8">${row._tipo==='dir'?'· directo':row._tipo==='ind'?'· indirecto':''}</span>`:''}${hasDist(row)?`<span class="dist-badge" data-tip="${getDistNote(row)}">✦</span>`:''}</div></td>
        ${vals.map(v=>`<td class="r">${v?fmtD(v):'—'}</td>`).join('')}
        <td class="r" style="font-weight:600">${tot?fmtD(tot):'—'}</td>
        ${notesCol?`<td class="note-cell">${notaMostrar}</td>`:''}
      </tr>`;
    } else if(row._child){
      const childVisible=ST.expandedRows.has(row._parentId);
      // No incluir secClass/subClass para que toggleSection no los muestre directamente
      html+=`<tr class="row-child row-subchild ${childVisible?'':' hidden'}" data-parentid="${row._parentId}" style="${isMuted?'color:#9A8E7D;font-style:italic':''}">
        ${showNumCol?`<td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${row._num||''}</td>`:''}
        <td class="indent">${row._nom}${searchMode&&row._tipo?` <span style="font-size:9px;font-weight:500;color:var(--muted);font-family:'DM Mono',monospace;opacity:.8">${row._tipo==='dir'?'· directo':row._tipo==='ind'?'· indirecto':''}</span>`:''}</td>
        ${vals.map(v=>`<td class="r">${v?fmtD(v):'—'}</td>`).join('')}
        <td class="r">${tot?fmtD(tot):'—'}</td>
        ${notesCol?`<td class="note-cell">${notaMostrar}</td>`:''}
      </tr>`;
    } else {
      html+=`<tr class="row-parent ${secClass} ${subClass}"${hiddenStyle} style="${isMuted?'color:#9A8E7D;font-style:italic':''}">
        ${showNumCol?`<td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${row._num||''}</td>`:''}
        <td>${row._nom}${searchMode&&row._tipo?` <span style="font-size:9px;font-weight:500;color:var(--muted);font-family:'DM Mono',monospace;opacity:.8">${row._tipo==='dir'?'· directo':row._tipo==='ind'?'· indirecto':''}</span>`:''}${hasDist(row)?`<span class="dist-badge" data-tip="${getDistNote(row)}">✦</span>`:''}</td>
        ${vals.map(v=>`<td class="r">${v?fmtD(v):'—'}</td>`).join('')}
        <td class="r">${tot?fmtD(tot):'—'}</td>
        ${notesCol?`<td class="note-cell">${notaMostrar}</td>`:''}
      </tr>`;
    }
  });

  // ── FILAS DEL PIE: nombres y valores vienen del sheet ──
  // Para un líder de área estas filas (Gastos Totales/Resultado antes-después
  // de impuestos/Impuestos) cierran con los indirectos adentro -- ya se
  // muestra "RESULTADO SUBTOTAL DIRECTOS" arriba (subtotal_dir), que es el
  // resultado solo con gastos directos, así que estas se ocultan para no
  // mostrar un número que mezcla algo que no se está viendo en el detalle.
  if(!tipoFilter&&!q&&!ocultarIndirectos){
    // Orden: gastos totales (cierra Directos+Indirectos) → resultado antes → impuestos → resultado después
    const footerRows=[
      {row:d.gastosTotalesRow,style:'bordeaux'},
      {row:d.resAntesRow,   style:'verde'},
      {row:d.impuestosRow,  style:'section'},
      {row:d.resDespuesRow, style:'verde-dark'},
    ];
    footerRows.forEach(({row:r,style})=>{
      if(!r) return;
      html+=renderFooterRow(r,style);
    });
  }

  return html;
}


function toggleParent(pid,rowEl){
  rowEl.classList.toggle('open');
  document.querySelectorAll(`tr[data-parentid="${pid}"]`).forEach(r=>r.classList.toggle('hidden'));
  if(ST.expandedRows.has(pid)) ST.expandedRows.delete(pid);
  else ST.expandedRows.add(pid);
}
function toggleConsolidado(btn){
  const isActive=btn.classList.contains('active');
  // Deactivate all month tabs, then activate/deactivate consolidado
  document.querySelectorAll('#month-tabs .mtab').forEach(el=>el.classList.remove('active'));
  if(!isActive){
    ST.consolidado=true;
    btn.classList.add('active');
  }
  const mes=!isActive?'__consolidado__':(ST.currentMes||ST.meses[0]);
  if(isActive){
    ST.consolidado=false;
    // Reactivate current month tab
    document.querySelectorAll('#month-tabs .mtab').forEach(el=>{if(el.dataset.mes===ST.currentMes)el.classList.add('active');});
  }
  const tipoEl=document.getElementById('det-tipo');
  const areaEl=document.getElementById('det-area');
  const searchEl=document.getElementById('det-search');
  applyDetalleTable(
    mes,
    tipoEl?tipoEl.value:'Todos los tipos',
    areaEl?areaEl.value:'Todas las áreas',
    searchEl?searchEl.value:''
  );
}
function toggleSection(secId,rowEl){
  const isOpen=rowEl.classList.toggle('sec-open');
  if(isOpen) ST.expandedSecs.add(secId); else ST.expandedSecs.delete(secId);
  if(isOpen){
    // Show only direct children (sec-child but NOT sub-child)
    document.querySelectorAll(`.sec-child-${secId}`).forEach(r=>{
      const isSubChild=[...r.classList].some(c=>c.startsWith('sub-child-'));
      const isRowSubchild=r.classList.contains('row-subchild');
      if(!isSubChild&&!isRowSubchild) r.style.display='';
    });
  } else {
    // Hide ALL children (direct and sub-children), reset subsection states
    document.querySelectorAll(`.sec-child-${secId}`).forEach(r=>{
      r.style.display='none';
    });
    // Reset subsection open state and remove from expandedSubs
    document.querySelectorAll(`[data-subid].sec-child-${secId}`).forEach(r=>{
      r.classList.remove('sec-open');
      const subId=r.dataset.subid;
      if(subId) ST.expandedSubs.delete(subId);
    });
    // Reset cuentas con desplegable propio (ej. "Sueldos y CS Indirectos")
    // que hayan quedado abiertas — si no, al volver a abrir la sección
    // reaparecen expandidas en vez de arrancar colapsadas.
    document.querySelectorAll(`.sec-child-${secId}[data-pid]`).forEach(r=>{
      r.classList.remove('open');
      const pid=r.dataset.pid;
      if(pid){
        ST.expandedRows.delete(pid);
        document.querySelectorAll(`tr[data-parentid="${pid}"]`).forEach(c=>c.classList.add('hidden'));
      }
    });
  }
}
function toggleSubsection(subId,rowEl){
  rowEl.classList.toggle('sec-open');
  const isOpen=rowEl.classList.contains('sec-open');
  if(isOpen) ST.expandedSubs.add(subId); else ST.expandedSubs.delete(subId);
  document.querySelectorAll(`.sub-child-${subId}`).forEach(r=>{
    r.style.display=isOpen?'':'none';
  });
}

// Índices de mes (0-based) dentro de ST.clasifRubros.meses -- todo el mes en
// consolidado, o el único índice que matchee "mes" (case-insensitive, la
// hoja trae los meses en mayúsculas). [] si "mes" no está cargado ahí.
function clasifMesesIdx(mes){
  if(!ST.clasifRubros) return [];
  if(mes==='__consolidado__') return ST.clasifRubros.meses.map((_,i)=>i);
  const i=ST.clasifRubros.meses.findIndex(m=>m.toUpperCase()===String(mes).toUpperCase());
  return i>=0?[i]:[];
}

function calcRubros(mes){
  const rf={Personal:0,Tecnología:0,Infraestructura:0,'Servicios Financieros':0};
  const rs={};
  new Set(Array.from(GASTOS_SEMIFIJOS).map(semifijoGrupoNombre)).forEach(n=>rs[n]=0);
  const rv={Comercial:0,Honorarios:0,Generales:0,'Intereses e Impuestos':0};
  let totalFijos=0,totalSemifijos=0,totalVars=0;

  // Fuente principal: la hoja "Clasificación de gastos" (ST.clasifRubros) ya
  // trae, por cuenta y mes, el monto real y la categoría tal como la carga
  // el usuario -- es más confiable que re-derivarla fila por fila desde la
  // hoja "por mes" (agrupada por área), que puede quedar desalineada (caso
  // real: Julio daba 793k de Fijos acá vs 818k en "Gastos Fijos Detalle",
  // que sí coincide con el total que la propia Clasificación de gastos
  // calcula para ese mes).
  // ST.clasifRubros es un total de TODA la empresa, sin desglose por área --
  // no sirve para un líder de área (una sola área visible): siempre se
  // recalcula fila por fila desde su propia hoja "por mes" en ese caso,
  // igual que ya hace calcFijosVariables.
  if(ST.role!=='lideres'&&ST.clasifRubros){
    const mesesIdx=clasifMesesIdx(mes);
    ST.clasifRubros.rubros.forEach(r=>{
      const total=mesesIdx.reduce((s,i)=>s+(r.vals[i]||0),0);
      if(!total) return;
      const cat=r.categoria;
      if(cat==='Semi-fijo'){const g=semifijoGrupoNombre(r.nombre);rs[g]=(rs[g]||0)+total;totalSemifijos+=total;}
      else if(cat==='Fijo'){const g=NOMBRE_A_RUBRO_FIJO[r.nombre]||r.nombre;rf[g]=(rf[g]||0)+total;totalFijos+=total;}
      else if(cat==='Variable'){const g=NOMBRE_A_RUBRO_VAR[r.nombre]||'Generales';rv[g]=(rv[g]||0)+total;totalVars+=total;}
    });
    return{rf,rs,rv,totalFijos,totalSemifijos,totalVars};
  }

  // Respaldo (y camino obligado para líderes de área) -- se recalcula fila
  // por fila desde la hoja "por mes". Para un líder de área se excluyen las
  // filas de "GASTOS INDIRECTOS" (ver filasDirectasLideres).
  const isCons=mes==='__consolidado__';
  const meses=isCons?ST.meses:[mes];
  const PARENT_NAMES=new Set(Object.keys(PARENT_CHILDREN));
  const SKIP_RE=/^(FACTURACI[OÓ]N|GASTOS DIRECTOS|GASTOS INDIRECTOS|GASTOS?\s+TOTALES?|SUBTOTAL|RESULTADO|DÓLAR|TOTAL DE GASTOS)/i;
  meses.forEach(m=>{
    const md=ST.mesData[m];if(!md)return;
    filasDirectasLideres(md).forEach(row=>{
      const nom=String(row['']||row[md.nameCol]||'').trim();
      if(!nom||SKIP_RE.test(nom))return;
      const note=String(row._allNotes||'').trim();
      if(/ya\s+descontado|incluido\s+fac/i.test(note))return;
      if(PARENT_NAMES.has(nom))return;
      const total=AREAS.reduce((s,a)=>s+getAreaVal(row,a),0);
      if(total===0)return;
      const cat=getCategoriaFor(nom);
      if(cat==='Semi-fijo'){const g=semifijoGrupoNombre(nom);rs[g]=(rs[g]||0)+total;totalSemifijos+=total;}
      else if(cat==='Fijo'){const g=NOMBRE_A_RUBRO_FIJO[nom]||nom;rf[g]=(rf[g]||0)+total;totalFijos+=total;}
      else if(cat==='Variable'){const g=NOMBRE_A_RUBRO_VAR[nom]||'Generales';rv[g]=(rv[g]||0)+total;totalVars+=total;}
    });
  });
  return{rf,rs,rv,totalFijos,totalSemifijos,totalVars};
}

// Desglose para "Estructura de gastos por mes": Comisiones Productores e
// Impuestos se sacan de Variables para mostrarse en su propia serie —
// las 4 series suman el total real de gastos del mes, sin duplicar nada.
function calcCostosBarMes(mes){
  const{totalFijos,totalVars}=calcRubros(mes);
  let comisiones=0,impuestos=0;

  if(ST.clasifRubros){
    const mesesIdx=clasifMesesIdx(mes);
    ST.clasifRubros.rubros.forEach(r=>{
      if(r.nombre!=='Comisiones Productores'&&r.nombre!=='Impuestos') return;
      const total=mesesIdx.reduce((s,i)=>s+(r.vals[i]||0),0);
      if(r.nombre==='Comisiones Productores') comisiones+=total; else impuestos+=total;
    });
    return{fijos:totalFijos,comisiones,impuestos,variables:totalVars-comisiones-impuestos};
  }

  const isCons=mes==='__consolidado__';
  const meses=isCons?ST.meses:[mes];
  const SKIP_RE=/^(FACTURACI[OÓ]N|GASTOS DIRECTOS|GASTOS INDIRECTOS|SUBTOTAL|RESULTADO|DÓLAR|TOTAL DE GASTOS)/i;
  meses.forEach(m=>{
    const md=ST.mesData[m];if(!md)return;
    md.rows.forEach(row=>{
      const nom=String(row['']||row[md.nameCol]||'').trim();
      if(nom!=='Comisiones Productores'&&nom!=='Impuestos')return;
      if(SKIP_RE.test(nom))return;
      const note=String(row._allNotes||'').trim();
      if(/ya\s+descontado|incluido\s+fac/i.test(note))return;
      const total=AREAS.reduce((s,a)=>s+getAreaVal(row,a),0);
      if(nom==='Comisiones Productores') comisiones+=total;
      else impuestos+=total;
    });
  });
  return{fijos:totalFijos,comisiones,impuestos,variables:totalVars-comisiones-impuestos};
}

  const {rf,rv}=calcRubros(mes);
  const isCons=mes==='__consolidado__';

  // KPIs
  const agg=isCons?getAgg():(ST.mesData[mes]?.agg||{});
  const tI=AREAS.reduce((s,a)=>s+(agg[a]?.ingresos||0),0);
  const tR=AREAS.reduce((s,a)=>s+(agg[a]?.resultado||0),0);
  const margen=tI?tR/tI*100:0;
  const ratioFijos=tI?(fv.fijos/tI*100):0;
  const suelTot=(()=>{
    const isCons2=mes==='__consolidado__';
    const meses2=isCons2?ST.meses:[mes];
    const PNAMES=new Set(Object.keys(PARENT_CHILDREN));
    let tot=0;
    meses2.forEach(m=>{
      const md=ST.mesData[m];if(!md)return;
      md.rows.forEach(row=>{

      });

  const ratioSueldos=tI?(suelTot/tI*100):0;

  // Gasto fijo que más aumentó (solo consolidado — comparar último mes vs penúltimo)
  let gastoMayorAumento='';

    const mUlt=ST.meses[ST.meses.length-1];
    const mPri=ST.meses[0];

const RUBRO_CAT_COLOR={'Fijo':'#003F61','Semi-fijo':'#476785','Variable':'#9A8E7D'};

// ── ANÁLISIS INTERANUAL — Gastos Fijos, mismo mes 2025 vs 2026 ──
// Compara, rubro por rubro, cada mes cargado de 2026 contra el MISMO mes de
// 2025 (Enero vs Enero, Febrero vs Febrero, etc.) en vez de un mes fijo
// (se usaba Diciembre 2025) -- comparar contra un mes fijo con estacionalidad
// propia (Diciembre trae aguinaldo/bonos) distorsionaba el Δ% de todos los
// demás meses. Mismo-mes-año-contra-año es el estándar para este análisis.
// Una celda de comparación: monto 2026 + Δ% vs. el mismo mes de 2025,
// coloreado por signo (positivo = verde, negativo = bordeaux), igual que
// el gráfico de variación por rubro.
// Color inline (no clase) porque td.pos/td.neg del resto de la app pinta el
// <td> entero, y acá el % va en una línea aparte dentro de la celda.
function deltaCellHTML(base,v,bold){
  if(v==null) return `<td class="r" style="color:var(--muted)">—</td>`;
  const delta=base?((v-base)/base*100):(v?100:0);
  const color=delta>0.5?'var(--verde)':delta<-0.5?'var(--bordeaux)':'var(--muted)';
  const sign=delta>=0?'+':'';
  return `<td class="r"${bold?' style="font-weight:700"':''}>${fmtD(v)}<div style="font-size:10px;font-weight:700;color:${color}">${sign}${delta.toFixed(0)}%</div></td>`;
}

// Arma el cruce 2025/2026 una sola vez -- lo comparten la tabla mensual y
// los gráficos, para no repetir el matching de nombres (normSearch) en
// varios lugares.
function buildInteranualData(){
  const d2025=getGastosFijos2025();
  const d2026=ST.gastosFijosDetalle;
  if(!d2026) return null;
  const meses=ST.meses; // los que ya estén cargados de 2026 (hoy Ene-Jul)
  const idx2025=mes=>d2025.valCols.indexOf(mes);
  const idx2026=mes=>d2026.valCols.indexOf(mes);
  // Nombre normalizado (sin acentos/mayúsculas) -- 2025 y 2026 no siempre
  // escriben el rubro/proveedor exactamente igual (ver el resto de la app:
  // es un bug recurrente entre hojas distintas).
  const by2025=new Map(d2025.cuentas.map(c=>[normSearch(c.nombre),c]));
  const by2026=new Map(d2026.cuentas.map(c=>[normSearch(c.nombre),c]));
  // Casos puntuales donde un proveedor de 2025 se abrió en varios de 2026
  // (ej. el alquiler de la oficina de Neix -- P8 Buenavista -- en 2025
  // venía como una sola línea "Alquiler+Expensas" y en 2026 se separó en
  // "Alquiler P8 Buenavista" + "Expensas P8 Buenavista"). Sin esto, el de
  // 2025 no encuentra match exacto y queda comparado contra $0 (-100%) como
  // si se hubiera dejado de pagar, cuando en realidad sigue ahí con otro
  // nombre.
  // Chequeo exhaustivo de los 142 proveedores de 2025 contra los 65 de
  // 2026 (Ene-Jul): además del caso de P8 Buenavista, estos 7 son la
  // misma línea con el nombre acortado/sin el prefijo "Neix:" en 2026.
  const ALIAS_PROVEEDORES_COMBO={
    'p8 buenavista (alquiler+expensas)':['alquiler p8 buenavista','expensas p8 buenavista'],
    'coding & company (mantenimiento)':['coding & company'],
    'inargind (sgc/sponsor)':['inargind (sgc)'],
    'visma argentina (abono licencias)':['visma argentina'],
    'neix: adobe':['adobe'],
    'neix: all pago':['all pago'],
    'neix: camara de agentes (cuota social)':['camara de agentes (cuota social)'],
    'neix: microsoft (nss s.a.)':['microsoft (nss s.a.)'],
  };
  // Lado 2026 -> lado 2025 de cada combo, para no listar el proveedor de
  // 2026 dos veces (una como "hijo" del combo, otra como si fuera nuevo).
  const aliasReverso=new Map();
  Object.entries(ALIAS_PROVEEDORES_COMBO).forEach(([k,arr])=>arr.forEach(a=>aliasReverso.set(a,k)));

  // Proveedores que la Clasificación reubicó de RUBRO entre 2025 y 2026 --
  // mismo gasto recurrente, pero bajo otra cuenta (ej. Gimenez Ezequiel
  // estaba en Honorarios Profesionales en 2025 y en 2026 lo pasaron a
  // Servicios Contratados). Sin esto, el matching por rubro (que compara
  // proveedores DENTRO del mismo rubro) los ve como dos gastos distintos:
  // uno "de baja" en el rubro viejo y otro "nuevo" en el rubro nuevo.
  const RECLASIFICACION_PROVEEDORES={
    'gimenez ezequiel':{rubro2025:'Honorarios Profesionales',rubro2026:'Servicios Contratados'},
  };

  // El usuario quiere ver TODO: no solo los rubros/proveedores de 2025 (con
  // o sin match en 2026), sino también los que arrancaron recién en 2026 y
  // antes ni existían -- así que la lista de rubros es la UNIÓN de ambos
  // años, no solo los de 2025.
  const nombresRubros=d2025.cuentas.map(c=>c.nombre);
  const vistosRubros=new Set(nombresRubros.map(n=>normSearch(n)));
  d2026.cuentas.forEach(c=>{
    const key=normSearch(c.nombre);
    if(!vistosRubros.has(key)){ vistosRubros.add(key); nombresRubros.push(c.nombre); }
  });

  const totalesPorMes={}; meses.forEach(m=>totalesPorMes[m]={v2025:0,v2026:0});
  const rubros=nombresRubros.map(nombre=>{
    const key=normSearch(nombre);
    const c2025=by2025.get(key)||null;
    const c2026=by2026.get(key)||null;
    const esFijo=esCuentaFija(nombre);
    const by2026Prov=c2026?new Map(c2026.providers.map(p=>[normSearch(p.nombre),p])):new Map();
    const by2025Prov=c2025?new Map(c2025.providers.map(p=>[normSearch(p.nombre),p])):new Map();
    const perMes={};
    meses.forEach(mes=>{
      const i25=idx2025(mes),i26=idx2026(mes);
      // Si el rubro directamente no existe ESE año (nunca se pagó / recién
      // arrancó), el monto real de ese año es $0 -- no "sin dato". Eso es
      // justamente lo que se quiere ver: la baja o el alta se refleja como
      // un Δ% real (-100% o +100%), no como un "—" que la esconde.
      const v2025=c2025?(c2025.total&&i25>=0?c2025.total.vals[i25]:0):0;
      const v2026=c2026?(c2026.total&&i26>=0?c2026.total.vals[i26]:0):0;
      perMes[mes]={v2025,v2026};
      // El total solo suma rubros que la Clasificación de gastos real marca
      // como Fijo -- si no, uno que en realidad es Variable (ej. Honorarios
      // por Servicios, que quedó en esta hoja por historial) infla el total
      // sin ser un costo fijo real y el Δ% general queda engañoso.
      if(esFijo){
        totalesPorMes[mes].v2025+=v2025;
        totalesPorMes[mes].v2026+=v2026;
      }
    });
    // Proveedores: misma unión -- los de 2025 más los que aparecen recién
    // en 2026 (sin contar los que ya están cubiertos por un alias/combo, ni
    // los que son el destino 2026 de una reclasificación -- esos ya se
    // muestran desde su rubro de origen 2025, más abajo).
    const nombresProv=c2025?c2025.providers.map(p=>p.nombre):[];
    const vistosProv=new Set(nombresProv.map(n=>normSearch(n)));
    if(c2026) c2026.providers.forEach(p=>{
      const key2026=normSearch(p.nombre);
      const key2025DelCombo=aliasReverso.get(key2026);
      const reclasifDestino=RECLASIFICACION_PROVEEDORES[key2026];
      const esDestinoReclasif=reclasifDestino&&normSearch(reclasifDestino.rubro2026)===key;
      if(vistosProv.has(key2026)||(key2025DelCombo&&vistosProv.has(key2025DelCombo))||esDestinoReclasif) return;
      vistosProv.add(key2026);
      nombresProv.push(p.nombre);
    });
    const providers=nombresProv.map(nombreProv=>{
      const provKey=normSearch(nombreProv);
      const p2025=by2025Prov.get(provKey)||null;
      const reclasif=RECLASIFICACION_PROVEEDORES[provKey];
      const esOrigenReclasif=reclasif&&normSearch(reclasif.rubro2025)===key;
      let p2026;
      if(esOrigenReclasif){
        // Se movió de rubro -- buscar su fila 2026 en el rubro DESTINO, no
        // en el actual.
        const c2026Destino=by2026.get(normSearch(reclasif.rubro2026));
        p2026=c2026Destino?.providers.find(p=>normSearch(p.nombre)===provKey)||null;
      } else {
        const aliasKeys=ALIAS_PROVEEDORES_COMBO[provKey];
        const combo=aliasKeys&&aliasKeys.map(k=>by2026Prov.get(k)).filter(Boolean);
        p2026=by2026Prov.get(provKey)||(combo&&combo.length?{nombre:nombreProv,vals:combo[0].vals.map((_,i)=>combo.reduce((s,p)=>s+(p.vals[i]||0),0))}:null);
      }
      const pPerMes={};
      meses.forEach(mes=>{
        const i25=idx2025(mes),i26=idx2026(mes);
        pPerMes[mes]={
          v2025:p2025?(i25>=0?p2025.vals[i25]:0):0,
          v2026:p2026?(i26>=0?p2026.vals[i26]:0):0,
        };
      });
      return {nombre:nombreProv,en2025:!!p2025,en2026:!!p2026,perMes:pPerMes};
    });
    // "Sin discriminar / Ajuste" -- no es un proveedor con nombre real (son
    // gastos sin identificar, reversiones de provisión, etc.), pero sin
    // mostrarlo el desglose de proveedores no suma el total del rubro. La
    // hoja lo guarda aparte de la lista de proveedores (ver
    // parseGastosFijosDetalle), así que se agrega acá a mano.
    if(c2025?.ajuste||c2026?.ajuste){
      const ajustePerMes={};
      meses.forEach(mes=>{
        const i25=idx2025(mes),i26=idx2026(mes);
        ajustePerMes[mes]={
          v2025:c2025?.ajuste&&i25>=0?c2025.ajuste.vals[i25]:0,
          v2026:c2026?.ajuste&&i26>=0?c2026.ajuste.vals[i26]:0,
        };
      });
      providers.push({nombre:'Sin discriminar / Ajuste',en2025:!!c2025?.ajuste,en2026:!!c2026?.ajuste,perMes:ajustePerMes});
    }
    return {nombre,en2025:!!c2025,en2026:!!c2026,esFijo,perMes,providers};
  });
  return {meses,rubros,totalesPorMes};
}

// Tags visibles al lado del nombre. Nuevo en 2026 = no se pagaba en 2025
// (arrancó este año). Dejó de pagarse = estaba en 2025 y no aparece en 2026.
const INTERANUAL_TAG_NUEVO=`<span style="color:var(--verde);font-size:10px">(nuevo en 2026)</span>`;
const INTERANUAL_TAG_BAJA=`<span style="color:var(--bordeaux);font-size:10px">(no se pagó en 2026)</span>`;

// Solo las filas de la tabla (sin los gráficos) -- se regenera sola al
// tipear en el buscador, sin tener que volver a dibujar los charts. Con la
// unión 2025+2026 la tabla puede tener muchas filas (proveedores puntuales
// que no se repitieron), así que igual que en las vistas 2025/2026 conviene
// poder filtrar por nombre.
// Celda de un mes puntual: solo el monto 2026, sin el Δ% -- el % mes a mes
// no es comparable de forma confiable (aguinaldo, estacionalidad, etc.), el
// que importa es el del período completo (ver deltaCellHTML, columna final).
function montoCellHTML(v){
  if(v==null) return `<td class="r" style="color:var(--muted)">—</td>`;
  return `<td class="r">${v?fmtD(v):'—'}</td>`;
}
function buildInteranualTableRowsHTML(data,q){
  const {meses,rubros,totalesPorMes}=data;
  const query=normSearch(q).trim();
  let rowsHtml='';
  // Este cuadro es específicamente de Gastos Fijos -- un rubro que no lo es
  // (ej. Honorarios por Servicios) no suma al TOTAL ni aparece en el
  // gráfico de variación, así que tampoco tiene sentido en la tabla.
  rubros.filter(r=>r.esFijo).forEach((r,ci)=>{
    const rubroMatches=query&&normSearch(r.nombre).includes(query);
    const providers=(!query||rubroMatches)?r.providers:r.providers.filter(p=>normSearch(p.nombre).includes(query));
    if(query&&!rubroMatches&&!providers.length) return;
    const tag=(!r.en2025?' '+INTERANUAL_TAG_NUEVO:'')+(!r.en2026?' '+INTERANUAL_TAG_BAJA:'');
    const cells=meses.map(mes=>montoCellHTML(r.perMes[mes].v2026)).join('');
    // Período completo (suma de los meses ya cargados) -- acá sí va el Δ%.
    const cons25=meses.reduce((s,mes)=>s+r.perMes[mes].v2025,0);
    const cons26=meses.reduce((s,mes)=>s+r.perMes[mes].v2026,0);
    const consCell=deltaCellHTML(cons25,cons26,true);
    const cid='cmp-'+ci;
    const key=normSearch(r.nombre).replace(/'/g,"\\'");
    const open=!!query||ST.gfdExpanded.has(normSearch(r.nombre));
    const hasDropdown=r.providers.length>0;
    if(hasDropdown){
      rowsHtml+=`<tr class="row-parent${open?' open':''}" data-cid="${cid}" onclick="toggleCostosCuenta('${cid}',this,'${key}')">
        <td><div class="name-wrap"><span class="toggle-icon">▶</span>${r.nombre}${tag}</div></td>
        ${cells}${consCell}
      </tr>`;
      providers.forEach(p=>{
        const ptag=(!p.en2025?' '+INTERANUAL_TAG_NUEVO:'')+(!p.en2026?' '+INTERANUAL_TAG_BAJA:'');
        const esAjuste=p.nombre==='Sin discriminar / Ajuste';
        const pcells=meses.map(mes=>esAjuste?ajusteAmountCellHTML(r.nombre,'2026',mes,p.perMes[mes].v2026,'r'):montoCellHTML(p.perMes[mes].v2026)).join('');
        const pCons25=meses.reduce((s,mes)=>s+p.perMes[mes].v2025,0);
        const pCons26=meses.reduce((s,mes)=>s+p.perMes[mes].v2026,0);
        rowsHtml+=`<tr class="row-child${open?'':' hidden'}" data-parentid="${cid}">
          <td class="indent">${p.nombre}${ptag}</td>
          ${pcells}${deltaCellHTML(pCons25,pCons26,true)}
        </tr>`;
      });
    } else {
      rowsHtml+=`<tr class="row-parent">
        <td><div class="name-wrap"><span class="toggle-icon" style="visibility:hidden">▶</span>${r.nombre}${tag}</div></td>
        ${cells}${consCell}
      </tr>`;
    }
  });
  // El TOTAL suma TODOS los rubros Fijos, filtrados o no -- mezclarlo con
  // una búsqueda puntual sería engañoso, así que se oculta mientras se
  // busca (mismo criterio que la tabla de Gastos Fijos 2025/2026).
  if(!query){
    const totalCells=meses.map(mes=>montoCellHTML(totalesPorMes[mes].v2026)).join('');
    const totalCons25=meses.reduce((s,mes)=>s+totalesPorMes[mes].v2025,0);
    const totalCons26=meses.reduce((s,mes)=>s+totalesPorMes[mes].v2026,0);
    rowsHtml+=`<tr class="row-total-bordeaux"><td>TOTAL (rubros Fijos, incluye altas y bajas)</td>${totalCells}${deltaCellHTML(totalCons25,totalCons26,true)}</tr>`;
  }
  if(query&&!rowsHtml) return '<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Sin resultados</div>';
  const periodo=meses.length?`${meses[0]}-${meses[meses.length-1]}`:'';
  return `<div style="overflow-x:auto"><table><thead><tr><th>Rubro / Proveedor</th>${meses.map(m=>`<th class="c">${m}<div style="font-size:9px;font-weight:400;color:var(--muted)">2026</div></th>`).join('')}<th class="c">Período (${periodo})<div style="font-size:9px;font-weight:400;color:var(--muted)">2026 vs 2025</div></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`;
}

function filterInteranual(q){
  ST.interanualSearchQuery=q;
  const data=buildInteranualData();
  const wrap=document.getElementById('interanual-table-wrap');
  if(wrap&&data) wrap.innerHTML=buildInteranualTableRowsHTML(data,q);
  const clr=document.getElementById('interanual-search-clear');
  if(clr) clr.classList.toggle('visible',q.length>0);
}
function clearInteranualSearch(){
  const el=document.getElementById('interanual-search');
  if(el) el.value='';
  filterInteranual('');
}

function buildComparativaInteranualTableHTML(){
  const data=buildInteranualData();
  if(!data){
    return `<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Cargando datos de 2026 para comparar…</div>`;
  }
  // Los montos están en USD -- al % de variación ya se le resta la
  // depreciación del peso del período (crecer X% en pesos no es lo mismo
  // que crecer X% en dólares si el tipo de cambio también subió). Aclarado
  // acá para no confundir un "creció poco en dólares" con "creció poco",
  // cuando en pesos puede haber crecido mucho más.
  const notaCambiaria=`<div style="margin:12px 16px 0;padding:8px 12px;background:var(--crema);border-radius:8px;font-size:11px;color:var(--muted)">Los montos están en USD: al % de crecimiento ya se le resta la depreciación del peso del período (un rubro puede crecer bastante en pesos y verse con un % más chico acá, en dólares).</div>`;
  const charts=`<div style="padding:16px 16px 4px;display:flex;gap:20px;flex-wrap:wrap">
    <div style="flex:1 1 300px;min-width:260px">
      <div style="font-size:12px;font-weight:600;color:var(--grafito)">Evolución total: 2025 vs 2026</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:10px">Gastos Fijos, mismo mes de cada año</div>
      <div style="height:220px"><canvas id="ch-interanual-evol"></canvas></div>
    </div>
    <div style="flex:1 1 300px;min-width:260px">
      <div style="font-size:12px;font-weight:600;color:var(--grafito)">Variación % por rubro</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:10px">Acumulado de los meses cargados · todos los rubros Fijos, incluye altas y bajas</div>
      <div style="height:220px"><canvas id="ch-interanual-rubros"></canvas></div>
    </div>
  </div>`;
  const table=`<div id="interanual-table-wrap">${buildInteranualTableRowsHTML(data,ST.interanualSearchQuery||'')}</div>`;

  return `${notaCambiaria}${charts}<div style="border-top:1px solid var(--border)">${table}</div>`;
}

function drawInteranualCharts(){
  if(typeof Chart==='undefined') return;
  const data=buildInteranualData();
  if(!data) return;
  const {meses,rubros,totalesPorMes}=data;

  dc('ch-interanual-evol');
  const elEvol=document.getElementById('ch-interanual-evol');
  if(elEvol){
    rc('ch-interanual-evol',new Chart(elEvol,{type:'bar',
      data:{labels:meses,datasets:[
        {label:'2025',data:meses.map(m=>totalesPorMes[m].v2025),backgroundColor:'#9A8E7D',borderRadius:4},
        {label:'2026',data:meses.map(m=>totalesPorMes[m].v2026),backgroundColor:'#003F61',borderRadius:4},
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:11},padding:10,usePointStyle:true}},
          tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${$c(c.raw,true)}`}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#E8E6E3'},ticks:{callback:v=>$c(v,true),font:{family:'DM Mono',size:10}}}}}}));
  }

  dc('ch-interanual-rubros');
  const elRub=document.getElementById('ch-interanual-rubros');
  if(elRub){
    // Todos los rubros Fijos, hayan matcheado o no -- una alta o baja
    // completa de un rubro entra igual, como +100%/-100%.
    const deltas=rubros.filter(r=>r.esFijo).map(r=>{
      let s25=0,s26=0;
      meses.forEach(m=>{ s25+=r.perMes[m].v2025; s26+=r.perMes[m].v2026; });
      const delta=s25?((s26-s25)/s25*100):(s26?100:0);
      return {nombre:r.nombre,delta,monto:s26-s25};
    }).sort((a,b)=>b.delta-a.delta);
    // El signo/color es al revés de deltaCellHTML a pedido: en este gráfico
    // negativo (bajó) = rojo, positivo (subió) = verde. Además se dibuja el
    // % pegado a la punta de cada barra -- con outliers grandes (ej. un
    // rubro que se disparó) la escala del eje se estira y el resto de las
    // barras queda ilegible si solo se puede leer por posición en el eje.
    // indexAxis va DENTRO de options -- puesto al mismo nivel que "type"
    // (como en mkHoriz, que nadie llama), esta versión de Chart.js no
    // termina de tratar el eje X como numérico y lo trata como categórico:
    // todas las barras quedan del mismo largo relativo (según su posición
    // en la lista, no según el Δ% real) -- esa es la escala "rara" que no
    // se entendía.
    rc('ch-interanual-rubros',new Chart(elRub,{type:'bar',
      data:{labels:deltas.map(r=>r.nombre),datasets:[{data:deltas.map(r=>+r.delta.toFixed(1)),backgroundColor:deltas.map(r=>r.delta<-0.5?'#AB1930':r.delta>0.5?'#004836':'#B0ABA4'),borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        layout:{padding:{left:44,right:44}},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{
          const m=deltas[c.dataIndex].monto;
          return `${c.raw>=0?'+':''}${c.raw}% (${m>=0?'+':'-'}${$c(Math.abs(m),true)})`;
        }}}},
        scales:{
          x:{grid:{color:'#E8E6E3'},ticks:{maxTicksLimit:6,callback:v=>v+'%',font:{family:'DM Mono',size:10}}},
          y:{type:'category',grid:{display:false},ticks:{font:{size:10}}}
        }},
      plugins:[barDeltaLabelPlugin]}));
  }
}

// hoja "Clasificación de gastos" (no las agrupaciones internas del código).
// El % siempre es sobre el total general, aunque se filtre por categoría.
const RUBRO_CAT_ORDEN={'Fijo':0,'Semi-fijo':1,'Variable':2};
function buildRubrosTableHTML(cat,orden){
  const mes=ST.consolidado?'__consolidado__':(ST.currentMes||ST.meses[0]);
  const full=getClasifRubrosRanking(mes);
  const totalGasto=full.reduce((s,r)=>s+r.monto,0);
  let ranking=(!cat||cat==='Todas las categorías')?full:full.filter(r=>r.cat===cat);
  if(orden==='categoria'){
    ranking=[...ranking].sort((a,b)=>(RUBRO_CAT_ORDEN[a.cat]??9)-(RUBRO_CAT_ORDEN[b.cat]??9)||b.monto-a.monto);
  }
  const maxMonto=ranking.reduce((m,r)=>Math.max(m,r.monto),0);
  const rankingRows=ranking.map(r=>`<tr>
    <td>${r.nombre}</td>
    <td class="c"><span class="badge" style="color:${RUBRO_CAT_COLOR[r.cat]||'var(--muted)'};border-color:${RUBRO_CAT_COLOR[r.cat]||'var(--border)'}">${r.cat||'—'}</span></td>
    <td class="r">${fmt(r.monto,true)}</td>
    <td class="r">${totalGasto?(r.monto/totalGasto*100).toFixed(1):0}%</td>
    <td style="width:110px"><div class="hbar-track"><div class="hbar-fill" style="width:${maxMonto?(r.monto/maxMonto*100).toFixed(1):0}%;background:${RUBRO_CAT_COLOR[r.cat]||'var(--arena)'}"></div></div></td>
  </tr>`).join('');
  const catSel=`<select class="filter-sel-th" id="rubros-cat" onchange="filterRubrosRanking()">
    <option value="" ${!cat||cat==='Todas las categorías'?'selected':''}>Categoría</option>
    <option ${cat==='Fijo'?'selected':''}>Fijo</option>
    <option ${cat==='Variable'?'selected':''}>Variable</option>
  </select>`;
  return `<table><thead><tr><th>Rubro</th><th class="c">${catSel}</th><th class="r">Monto</th><th class="r">% del total</th><th></th></tr></thead>
    <tbody>${rankingRows||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Sin datos</td></tr>'}</tbody></table>`;
}

const DIACRITICS_RE=new RegExp('[̀-ͯ]','g');
const normSearch=s=>String(s||'').toLowerCase().normalize('NFD').replace(DIACRITICS_RE,'');

// ── Popup "¿Qué hay dentro de Sin discriminar / Ajuste?" ──
// Si hay detalle cargado (AJUSTES_DETALLE) para ese rubro/año/mes, el monto
// se muestra clickeable y abre un popup con los movimientos del mayor
// contable que lo componen. Si no hay detalle, el monto se muestra igual
// que siempre (no clickeable) -- no todos los meses/rubros tienen ajuste
// cargado a mano todavía.
function ajusteDetalle(rubro,year,mes){
  return AJUSTES_DETALLE[normSearch(rubro)]?.[year]?.[mes]||null;
}
function ajusteAmountCellHTML(rubro,year,mes,v,cls){
  if(v==null) return `<td class="${cls}" style="color:var(--muted)">—</td>`;
  const disp=v?fmtD(v):'—';
  const det=v?ajusteDetalle(rubro,year,mes):null;
  if(!det) return `<td class="${cls}">${disp}</td>`;
  const rubroEsc=rubro.replace(/'/g,"\\'");
  const mesEsc=mes.replace(/'/g,"\\'");
  return `<td class="${cls}"><span class="ajuste-link" onclick="event.stopPropagation();openAjusteModal('${rubroEsc}','${year}','${mesEsc}',${v})">${disp}</span></td>`;
}
// cellV es el monto que está la tabla en vivo (lo que la usuaria está
// mirando) -- puede no coincidir con det.total (el dato estático del
// detalle) si la hoja de Sheets cambió después de que se armó ese detalle.
// En vez de mostrar el total del detalle como si fuera el de la tabla
// (lo que hacía parecer que "no cierra"), se muestra el de la tabla
// siempre, y si difiere del detalle se avisa en vez de taparlo.
function openAjusteModal(rubro,year,mes,cellV){
  const det=ajusteDetalle(rubro,year,mes);
  if(!det) return;
  const rows=det.items.map(it=>`<tr>
      <td>${it.concepto}</td>
      <td class="c" style="white-space:nowrap;font-size:10px;color:var(--muted)">${it.grupo||''}</td>
      <td class="r" style="font-family:'DM Mono',monospace;white-space:nowrap">${it.monto?fmtD(it.monto):'—'}</td>
    </tr>`).join('');
  // Los "excluidos" (ej. Santangelo Sofia en Honorarios Profesionales) ya
  // se muestran en la tabla como proveedor con nombre propio (ver
  // PROVEEDOR_MANUAL_2026, que además ya resta su monto de la celda de
  // ajuste en vivo -- aplicarProveedoresManuales2026) -- acá no van ni
  // siquiera como nota, para no duplicarla.
  const sumItems=det.items.reduce((s,i)=>s+i.monto,0);
  // La celda en vivo (cellV) ya viene sin los excluidos (se le restan al
  // cargar la hoja), así que tiene que coincidir con sumItems -- si no
  // coincide, o cambió la hoja después de armar este detalle, o falta
  // restar a alguien nuevo en PROVEEDOR_MANUAL_2026.
  const desajustado=Math.abs((cellV||0)-sumItems)>1;
  const avisoDesajuste=desajustado?`<div style="padding:8px 20px;background:#FFF4E5;color:#8a5a00;font-size:11px">Ojo: la celda de la tabla tiene ${fmtD(cellV)}, pero este detalle solo explica ${fmtD(sumItems)}. La hoja pudo haber cambiado, o falta alguien en PROVEEDOR_MANUAL_2026.</div>`:'';
  const html=`<div id="ajuste-modal-overlay" onclick="if(event.target===this)closeAjusteModal()" style="position:fixed;inset:0;z-index:1000;background:rgba(61,61,61,.55);display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--grafito)">Sin discriminar / Ajuste</div>
          <div style="font-size:11px;color:var(--muted)">${rubro} · ${mes} ${year}</div>
        </div>
        <span onclick="closeAjusteModal()" style="cursor:pointer;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px">×</span>
      </div>
      ${avisoDesajuste}
      <div style="overflow-y:auto;padding:0 20px">
        <table style="width:100%">
          <thead><tr><th>Concepto</th><th class="c">Tipo</th><th class="r">Monto (USD)</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:11px;color:var(--muted)">
        <span>Movimientos del mayor contable que arman este residuo.</span>
        <span style="font-weight:700;color:var(--bordeaux)">Total: ${fmtD(sumItems)}</span>
      </div>
    </div>
  </div>`;
  closeAjusteModal();
  document.body.insertAdjacentHTML('beforeend',html);
}
function closeAjusteModal(){
  document.getElementById('ajuste-modal-overlay')?.remove();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAjusteModal();});

// En Consolidado se muestran todos los meses de la hoja (+ Total Semestre).
// Con un mes puntual seleccionado, se muestra solo la columna de ese mes.
// La vista "2025" siempre muestra el año completo (Ene-Dic): el selector de
// mes de arriba está atado a los meses que ya tiene cargados 2026 (hoy
// Ene-Jul), así que filtrar 2025 por ese mismo mes dejaba sin ver Ago-Dic.
function gfdVisibleColIdxs(valCols){
  if(ST.consolidado||ST.gfdView==='2025') return valCols.map((_,i)=>i);
  const curMes=ST.currentMes||ST.meses[0];
  const idx=valCols.indexOf(curMes);
  return idx>=0?[idx]:[];
}

function buildGfdTableHTML(q){
  const d=currentGfdData();
  if(!d) return '';
  const {valCols,cuentas,grandTotal}=d;
  const colIdxs=gfdVisibleColIdxs(valCols);
  if(!colIdxs.length){
    return `<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Esta hoja no tiene datos para ${ST.currentMes||ST.meses[0]}</div>`;
  }
  const cols=colIdxs.map(i=>valCols[i]);
  const pick=vals=>colIdxs.map(i=>vals[i]);
  const alignCls=cols.length===1?'c':'r';
  const query=normSearch(q).trim();
  let rowsHtml='';
  cuentas.forEach((c,ci)=>{
    const cuentaMatches=query&&normSearch(c.nombre).includes(query);
    const providers=(!query||cuentaMatches)?c.providers:c.providers.filter(p=>normSearch(p.nombre).includes(query));
    if(query&&!cuentaMatches&&!providers.length) return;
    const cid='cf-'+ci;
    const key=normSearch(c.nombre).replace(/'/g,"\\'");
    const open=!!query||ST.gfdExpanded.has(normSearch(c.nombre));
    const hasDropdown=c.providers.length>0;
    const totalVals=pick(c.total?c.total.vals:valCols.map(()=>0));
    if(hasDropdown){
      rowsHtml+=`<tr class="row-parent${open?' open':''}" data-cid="${cid}" onclick="toggleCostosCuenta('${cid}',this,'${key}')">
        <td><div class="name-wrap"><span class="toggle-icon">▶</span>${c.nombre}</div></td>
        ${totalVals.map(v=>`<td class="${alignCls}">${v?fmtD(v):'—'}</td>`).join('')}
      </tr>`;
    } else {
      rowsHtml+=`<tr class="row-parent">
        <td><div class="name-wrap"><span class="toggle-icon" style="visibility:hidden">▶</span>${c.nombre}</div></td>
        ${totalVals.map(v=>`<td class="${alignCls}">${v?fmtD(v):'—'}</td>`).join('')}
      </tr>`;
    }
    providers.forEach(p=>{
      rowsHtml+=`<tr class="row-child${open?'':' hidden'}" data-parentid="${cid}">
        <td class="indent">${p.nombre}</td>
        ${pick(p.vals).map(v=>`<td class="${alignCls}">${v?fmtD(v):'—'}</td>`).join('')}
      </tr>`;
    });
    if(hasDropdown&&c.ajuste&&(!query||cuentaMatches)){
      const year=ST.gfdView==='2025'?'2025':'2026';
      const ajusteVals=pick(c.ajuste.vals);
      rowsHtml+=`<tr class="row-child${open?'':' hidden'}" data-parentid="${cid}" style="color:var(--muted);font-style:italic">
        <td class="indent">${c.ajuste.label}</td>
        ${cols.map((mes,i)=>ajusteAmountCellHTML(c.nombre,year,mes,ajusteVals[i],alignCls)).join('')}
      </tr>`;
    }
  });
  if(!query&&grandTotal){
    rowsHtml+=`<tr class="row-total-bordeaux">
      <td>${grandTotal.label}</td>
      ${pick(grandTotal.vals).map(v=>`<td class="${alignCls}">${fmtD(v)}</td>`).join('')}
    </tr>`;
  }
  if(query&&!rowsHtml) return '<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Sin resultados</div>';
  return `<div style="overflow-x:auto"><table><thead><tr><th>Cuenta / Proveedor</th>${cols.map(v=>`<th class="${alignCls}">${v}</th>`).join('')}</tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`;
}

// key = nombre de rubro normalizado (sin acentos/mayúsculas) -- se guarda en
// ST.gfdExpanded para que abrir una cuenta en una vista (2025/2026/

// re-renderiza su tabla desde cero al cambiar de pestaña.
function toggleCostosCuenta(cid,el,key){
  const isOpen=el.classList.contains('open');
  el.classList.toggle('open');
  document.querySelectorAll(`.row-child[data-parentid="${cid}"]`).forEach(r=>{

  }
}

function buildMatrizTable(title,rowNames,tableKey,showDetalle=false){
  const data=ST.matrizData;
  const cols=ST.matrizCols||MATRIZ_COLS;
  const colsHdr=[...cols,'TOTAL'];
  function findRow(name){
    if(!data)return null;
    return data.find(r=>{
      const nom=Object.values(r)[0]||Object.values(r)[1]||'';
      return nom.trim().toLowerCase()===name.toLowerCase();
    });
  }
  function renderRow(name,indent=false,groupSlug=null){
    const row=findRow(name);
    const vals=cols.map(col=>{
      if(!row)return 0;
      return parsePct(row[col]);
    });
    const tot=vals.reduce((s,v)=>s+v,0);
    // Si la fila reparte el 100% entre varias áreas, redondear cada celda por
    // separado puede dejar el total en 99% (ej. 33+33+33). Si está cerca de
    // 100, mostrar 100% en vez de un "99%" que parece un error de reparto.
    const totDisplay=tot>0&&Math.abs(tot-100)<=2?100:tot;
    const labelStyle=indent?'padding-left:20px;font-size:11px;color:var(--muted)':'font-weight:500';
    const groupAttrs=groupSlug?` data-matrizgrupo="${groupSlug}" style="display:none"`:'';
    return`<tr${groupAttrs}>
      <td style="${labelStyle}">${indent?'↳ ':''} ${name}</td>
      ${vals.map(v=>{
        const cls=v===0?'ze':v>=25?'hi':'lo';
        return`<td class="pct-cell ${cls}">${v?v.toFixed(0)+'%':'—'}</td>`;
      }).join('')}
      <td class="pct-cell total-col">${totDisplay?totDisplay.toFixed(0)+'%':'—'}</td>
      ${showDetalle?`<td style="font-size:11px;color:var(--muted)">${row&&row['Detalle']?row['Detalle']:''}</td>`:''}
    </tr>`;
  }

  // Fila padre con desplegable propio (ej. "Gastos GENERALES (Neix)") —
  // mismos valores que renderRow, pero con ícono ▶ clickeable.
  function renderGroupHeader(name,slug){
    const row=findRow(name);
    const vals=cols.map(col=>row?parsePct(row[col]):0);
    const tot=vals.reduce((s,v)=>s+v,0);
    const totDisplay=tot>0&&Math.abs(tot-100)<=2?100:tot;
    return`<tr onclick="toggleMatrizGrupo('${slug}',this)" style="cursor:pointer">
      <td style="font-weight:600"><span class="matriz-grp-icon" style="display:inline-block;margin-right:5px;font-size:9px;color:var(--muted);transition:transform .15s">▶</span>${name}</td>
      ${vals.map(v=>{
        const cls=v===0?'ze':v>=25?'hi':'lo';
        return`<td class="pct-cell ${cls}">${v?v.toFixed(0)+'%':'—'}</td>`;
      }).join('')}
      <td class="pct-cell total-col">${totDisplay?totDisplay.toFixed(0)+'%':'—'}</td>
      ${showDetalle?`<td style="font-size:11px;color:var(--muted)">${row&&row['Detalle']?row['Detalle']:''}</td>`:''}
    </tr>`;
  }

  let html=`<div class="matriz-block">
    <div class="matriz-title">${title}</div>
    <div class="tc"><table>
    <thead><tr><th>Concepto</th>${colsHdr.map(c=>`<th class="c">${c}</th>`).join('')}${showDetalle?'<th>Detalle</th>':''}</tr></thead>
    <tbody>`;

  rowNames.forEach(name=>{
    const children=MATRIZ_GRUPOS[name];
    if(children){
      const slug=name.replace(/[^a-zA-Z0-9]/g,'');
      html+=renderGroupHeader(name,slug);
      children.forEach(ch=>{html+=renderRow(ch,true,slug);});
      return;
    }
    html+=renderRow(name,false);
  });

  html+=`</tbody></table></div></div>`;
  return html;
}
function toggleMatrizGrupo(slug,rowEl){

}

function calcFijosVariables(mes){
  // La hoja de Clasificación trae fijos/variables consolidados de toda la
  // empresa — solo sirve de atajo cuando se ve el total (acceso completo).
  // Para un líder de área (AREAS acotado a una sola) hay que recalcular
  // fila por fila con getAreaVal, si no el ratio queda con el fijo de
  // TODA la empresa dividido por la facturación de una sola área.
  if(ST.role!=='lideres'&&ST.clasifData&&ST.clasifData[mes]) return ST.clasifData[mes];
  const isCons=mes==='__consolidado__';
  const meses=isCons?ST.meses:[mes];
  let fijos=0,semifijos=0,variables=0;
  const PARENT_NAMES=new Set(Object.keys(PARENT_CHILDREN));
  const SKIP_RE=/^(FACTURACI[OÓ]N|GASTOS DIRECTOS|GASTOS INDIRECTOS|SUBTOTAL|RESULTADO|DÓLAR|TOTAL DE GASTOS)/i;

  meses.forEach(m=>{
    const md=ST.mesData[m];
    if(!md) return;
    filasDirectasLideres(md).forEach(row=>{
      const nom=String(row['']||row[md.nameCol]||'').trim();
      if(!nom||SKIP_RE.test(nom)) return;
      const note=String(row._allNotes||'').trim();
      if(/ya\s+descontado|incluido\s+fac/i.test(note)) return;
      if(PARENT_NAMES.has(nom)) return;
      const total=AREAS.reduce((s,a)=>s+getAreaVal(row,a),0);
      if(total===0) return;
      const cat=getCategoriaFor(nom);
      if(cat==='Semi-fijo') semifijos+=total;
      else if(cat==='Fijo') fijos+=total;
      else variables+=total; // 'Variable' o sin clasificar → variable (comportamiento previo por defecto)
    });
  });
  return{fijos,semifijos,variables};
}

// Ranking de rubros textuales tal como están en la hoja "Clasificación de gastos"
function getClasifRubrosRanking(mes){
  const d=ST.clasifRubros;
  if(!d) return [];
  const isCons=mes==='__consolidado__';
  const mesIdx=isCons?-1:d.meses.findIndex(m=>m.toUpperCase()===String(mes).toUpperCase());
  return d.rubros.map(r=>({
    nombre:r.nombre,
    cat:r.categoria,
    monto:isCons?r.vals.reduce((s,v)=>s+v,0):(mesIdx>=0?r.vals[mesIdx]:0),
  })).filter(r=>r.monto>0).sort((a,b)=>b.monto-a.monto);
}

function getConsolidadoDetalle(){
  if(!ST.meses.length) return null;
  const base=ST.mesData[ST.meses[0]];
  if(!base) return null;

  // Build merged rows: use base structure, sum area values across all months
  // Match rows by position index (same sheet structure across months)
  const merged=base.annotated.map((row,rowIdx)=>{
    const newRow={...row};
    AREAS.forEach(a=>{
      const key=Object.keys(row).find(k=>k.trim()===a)||a;
      let total=0;
      ST.meses.forEach(m=>{
        const md=ST.mesData[m];
        if(!md) return;
        // Match by num+nom only (avoids index shift bugs)
        const isSection=row._kind==='section'||row._kind==='subsection';
        const found=isSection
          ? md.annotated.find(r=>r._kind===row._kind&&r._seclabel===row._seclabel)
          : md.annotated.find(r=>r._num===row._num&&r._nom===row._nom);
        if(found) total+=getAreaVal(found,a);
      });
      newRow[key]=total;
    });
    // Also sum TOTALES (USD) column if present
    const totKey=Object.keys(row).find(k=>k.includes('TOTALES')||k.includes('TOTAL'));
    if(totKey){
      let totTotal=0;
      ST.meses.forEach(m=>{
        const md=ST.mesData[m];
        if(!md) return;
        const mrow=md.annotated[rowIdx];
        const r=mrow&&mrow._num===row._num&&mrow._nom===row._nom?mrow:md.annotated.find(r=>r._num===row._num&&r._nom===row._nom);
        if(r) totTotal+=parseNum(r[totKey]||0);
      });
      newRow[totKey]=totTotal;
    }
    return newRow;
  });

  // Sum totalGastosCell (sin CapN) across all months
  const totalGastosCell=ST.meses.reduce((s,m)=>{
    const v=ST.mesData[m]&&ST.mesData[m].totalGastosCell;
    return v!=null?s+v:s;
  },0)||null;

  // Sum result rows across months
  function mergeResultRow(key){
    const ref=ST.mesData[ST.meses[0]]&&ST.mesData[ST.meses[0]][key];
    if(!ref) return null;
    const newRow={...ref};
    AREAS.forEach(a=>{
      let total=0;
      ST.meses.forEach(m=>{
        const r=ST.mesData[m]&&ST.mesData[m][key];
        if(r) total+=getAreaVal(r,a);
      });
      const k=Object.keys(ref).find(k=>k.trim()===a)||a;
      newRow[k]=total;
    });
    return newRow;
  }
  const subtotalRow=mergeResultRow('subtotalRow');
  const indirectosRow=mergeResultRow('indirectosRow');
  const impuestosRow=mergeResultRow('impuestosRow');
  const resAntesRow=mergeResultRow('resAntesRow');
  const resDespuesRow=mergeResultRow('resDespuesRow');
  const gastosTotalesRow=mergeResultRow('gastosTotalesRow');

  return{...base,annotated:merged,totalGastosCell,subtotalRow,indirectosRow,impuestosRow,resAntesRow,resDespuesRow,gastosTotalesRow};
}


// col acepta un solo nombre de columna (un mes puntual) o un array de
// columnas a sumar (Consolidado -- ver comentario en getCapNAgg sobre por
// qué no se usa la columna "CONSOLIDADO CAP N" del Sheet directamente).
function calcFijosVariablesCapN(col,d){
  const cols=Array.isArray(col)?col:[col];
  const FIJOS_CAPN=new Set(['Alquiler','Sueldos y CS','Contabilidad','MTI']);
  let fijos=0,variables=0;
  d.rows.forEach(row=>{
    const nom=String(row['']||'').trim();
    if(!nom||/^(FACTURACI|GASTOS|RESULTADO)/i.test(nom)) return;
    const v=cols.reduce((s,c)=>s+(c?parseNum(row[c]||''):0),0);
    if(v===0) return;
    if(FIJOS_CAPN.has(nom)) fijos+=v;
    else variables+=v;
  });
  return{fijos,variables};
}

function _buildCapNTabs(){
  const d=ST.capnData;
  const tabsEl=document.getElementById('month-tabs');
  if(!tabsEl||!d) return;
  tabsEl.innerHTML='';
  const mesesCols=d.headers.filter(h=>h&&h!==''&&!/consolidado/i.test(h)&&h!=='Neix Banca Privada');
  const allMeses=['__consolidado__',...mesesCols];
  // Sincronizar con el mes actual del dash si el usuario no eligió explícitamente en CapN
  if(!ST.capnMesExplicit){
    if(ST.consolidado) ST.capnMes='__consolidado__';
    else if(ST.currentMes&&mesesCols.includes(ST.currentMes)) ST.capnMes=ST.currentMes;
  }
  allMeses.forEach(m=>{
    const label=m==='__consolidado__'?'Consolidado':m;
    const el=document.createElement('div');
    el.className='mtab'+(m===ST.capnMes?' active':'');
    el.dataset.mes=m; el.textContent=label;

      ST.capnMes=m;
      ST.capnMesExplicit=true;
      document.querySelectorAll('#month-tabs .mtab').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
      if(ST.currentTab==='analisis_capn') rebuildAnalisisCapN();
      else rebuildCapN();

  });
}

function rebuildCapN(){
  const container=document.getElementById('content');
  if(!container) return;
  const d=ST.capnData;
  if(!d||!d.rows||!d.rows.length){
    container.innerHTML='<div style="padding:32px;color:var(--muted)">Cargando datos de Capital N...</div>';
    return;
  }

  const mesesCols=d.headers.filter(h=>h&&h!==''&&!/consolidado/i.test(h)&&h!=='Neix Banca Privada');
  const curMes=ST.capnMes;
  const isConsolidado=curMes==='__consolidado__';
  // Consolidado: sumar los meses cargados en vez de confiar en la columna
  // "CONSOLIDADO CAP N" del Sheet -- ver comentario en getCapNAgg.
  const getCapN=row=>isConsolidado?mesesCols.reduce((s,m)=>s+parseNum(row[m]||''),0):(curMes?parseNum(row[curMes]||''):0);

  // Datos Banca Privada
  let bpIng=0,bpEgr=0,bpRes=0;
  if(isConsolidado){
    ST.meses.forEach(m=>{
      const agg=ST.mesData[m]&&ST.mesData[m].agg;
      if(agg&&agg['Banca Privada']){bpIng+=agg['Banca Privada'].ingresos||0;bpEgr+=agg['Banca Privada'].egresos||0;bpRes+=agg['Banca Privada'].resultado||0;}
    });
  } else {
    const agg=ST.mesData[curMes]&&ST.mesData[curMes].agg;
    if(agg&&agg['Banca Privada']){bpIng=agg['Banca Privada'].ingresos||0;bpEgr=agg['Banca Privada'].egresos||0;bpRes=agg['Banca Privada'].resultado||0;}
  }
  const bpByTipo={ing:bpIng,gasto:bpEgr,res:bpRes};

  const rows=d.rows.filter(r=>String(r['']||'').trim());

  let html=`<div style="overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 210px)">
  <table style="width:100%;table-layout:fixed;border-collapse:collapse">
  <thead><tr>
    <th style="width:28%;text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Cuenta</th>
    <th style="width:24%;text-align:center;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Banca Privada</th>
    <th style="width:33%;text-align:center;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-left:1px solid var(--border)">Capital N</th>
    <th style="width:33%;text-align:center;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-left:1px solid var(--border)">Total</th>
  </tr></thead><tbody>`;

  let currentSecId=null;
  let currentSecTipo=null;

  // Filas de resultado al pie (se acumulan y se renderizan al final)
  const footerRowsData=[];

  rows.forEach(row=>{
    const nom=String(row['']||'').trim();
    if(!nom) return;
    const isSectionRow=/^(FACTURACI[OÓ]N|GASTOS|RESULTADO)/i.test(nom);
    const isResultado=/^RESULTADO/i.test(nom);
    const capnV=getCapN(row);

    if(isSectionRow){
      if(/FACTURACI[OÓ]N/i.test(nom)) currentSecTipo='ing';
      else if(/GASTOS/i.test(nom))    currentSecTipo='gasto';
      else if(/RESULTADO/i.test(nom)) currentSecTipo='res';
    }

    const bpV=isSectionRow?(bpByTipo[currentSecTipo]||0):0;

    // Resultado va al pie
    if(isResultado){
      footerRowsData.push({nom,bpV,capnV});
      return;
    }

    if(isSectionRow){
      const isFact=currentSecTipo==='ing';
      currentSecId='capnsec-'+nom.replace(/[^a-zA-Z0-9]/g,'');
      const secIsOpen=ST.expandedSecs.has(currentSecId);
      const bpColor=bpV<0?'var(--bordeaux)':'var(--grafito)';
      const capnColor=capnV<0?'var(--bordeaux)':'var(--grafito)';
      html+=`<tr class="row-section${secIsOpen?' sec-open':''}" data-secid="${currentSecId}" onclick="toggleSection('${currentSecId}',this)">
        <td><span class="sec-toggle">▶</span>${nom}</td>
        <td style="text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:${bpColor}">${bpV?fmtD(bpV):'—'}</td>
        <td style="text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:${capnColor};border-left:1px solid var(--border)">${capnV?fmtD(capnV):'—'}</td>
        <td style="text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;border-left:1px solid var(--border);color:${(bpV+capnV)<0?'var(--bordeaux)':'var(--grafito)'}">${(bpV||capnV)?fmtD(bpV+capnV):'—'}</td>
      </tr>`;
      return;
    }

    // Subcuenta — con toggle igual que row-parent en detalle
    const secClass=currentSecId?`sec-child-${currentSecId}`:'';
    const secExpanded=currentSecId&&ST.expandedSecs.has(currentSecId);
    const hiddenStyle=secExpanded?'':' style="display:none"';
    const capnColor=capnV<0?'var(--bordeaux)':'var(--grafito)';
    html+=`<tr class="row-parent ${secClass}"${hiddenStyle}>
      <td style="padding-left:28px;color:var(--grafito)">${nom}</td>
      <td style="text-align:center;color:var(--muted)">—</td>
      <td style="text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:${capnColor};border-left:1px solid var(--border)">${capnV?fmtD(capnV):'—'}</td>
      <td style="text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:${capnColor};border-left:1px solid var(--border)">${capnV?fmtD(capnV):'—'}</td>
    </tr>`;
  });

  // Filas de resultado al pie
  footerRowsData.forEach(({nom,bpV,capnV})=>{
    const bpColor=bpV>=0?'var(--verde)':'var(--bordeaux)';
    const capnColor=capnV>=0?'var(--verde)':'var(--bordeaux)';
    html+=`<tr style="background:rgba(0,72,54,.07);border-top:2px solid rgba(0,72,54,.2)">
      <td style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde)">${nom}</td>
      <td style="text-align:center;font-weight:700;font-family:'DM Mono',monospace;font-size:12px;color:${bpColor}">${bpV?fmtD(bpV):'—'}</td>
      <td style="text-align:center;font-weight:700;font-family:'DM Mono',monospace;font-size:12px;color:${capnColor};border-left:1px solid var(--border)">${capnV?fmtD(capnV):'—'}</td>
      <td style="text-align:center;font-weight:700;font-family:'DM Mono',monospace;font-size:12px;border-left:1px solid var(--border);color:${(bpV+capnV)>=0?'var(--verde)':'var(--bordeaux)'}">${(bpV||capnV)?fmtD(bpV+capnV):'—'}</td>
    </tr>`;
  });

  html+=`</tbody></table></div>`;
  container.innerHTML=`<div style="padding:24px 32px 0">`+
    `<h2 style="font-size:20px;font-weight:700;color:var(--grafito);margin:0 0 4px">Capital N</h2>`+
    `<p style="font-size:12px;color:var(--muted);margin:0 0 16px">Banca Privada y Capital N · USD</p>`+
    `</div>`+html;
}

function getAgg(){
  const agg={};AREAS.forEach(a=>agg[a]={ingresos:0,gastos_dir:0,gastos_ind:0,egresos:0,resultado:0});
  ST.meses.forEach(m=>AREAS.forEach(a=>Object.keys(agg[a]).forEach(k=>agg[a][k]+=ST.mesData[m].agg[a][k])));
  return agg;
}
function _ensureConsolidadoBtn(){
  if(document.getElementById('cons-btn')) return;
  const tabs=document.getElementById('month-tabs');
  if(!tabs) return;

  btn.id='cons-btn';
  btn.className='mtab'+(ST.consolidado?' active':'');

  btn.style.cssText='margin-left:8px;border-left:1px solid var(--border);padding-left:8px';
  btn.addEventListener('click',()=>toggleConsolidado(btn));

  if(ST.consolidado){
    document.querySelectorAll('#month-tabs .mtab:not(#cons-btn)').forEach(el=>el.classList.remove('active'));
  } else {
    const cur=ST.currentMes||ST.meses[0];
    document.querySelectorAll('#month-tabs .mtab').forEach(el=>{

function toggleConsolidado(btn){
  const isActive=btn.classList.contains('active');
  document.querySelectorAll('#month-tabs .mtab').forEach(el=>el.classList.remove('active'));
  if(!isActive){
    btn.classList.add('active');
    ST.consolidado=true;
  } else {
    ST.consolidado=false;
    const cur=ST.currentMes||ST.meses[0];
    document.querySelectorAll('#month-tabs .mtab').forEach(el=>{
      if(el.dataset.mes===cur) el.classList.add('active');
    });
  }
  renderCurrentTab();
  setTimeout(()=>drawCharts(ST.currentTab),60);
}

function switchTab(tab){
  const prevTab=ST.currentTab;
  ST.currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  const showMes=['por-mes','detalle','capn','analisis','analisis_capn','costos'].includes(tab);
  document.getElementById('month-tabs').style.display=showMes?'flex':'none';
  // Si veníamos de capn, restaurar los tabs normales de mes
  if(prevTab==='capn'&&tab!=='capn'&&tab!=='analisis_capn'){_buildNormalTabs();}
  if(prevTab==='analisis_capn'&&tab!=='capn'&&tab!=='analisis_capn'){_buildNormalTabs();}
  if(tab==='capn'||tab==='analisis_capn') _buildCapNTabs();
  // Botón consolidado global — siempre presente en pestañas con mes
  const showCons=['por-mes','detalle','analisis','costos'].includes(tab);
  if(!showCons){const b=document.getElementById('cons-btn');if(b)b.remove();}
  if(showCons) _ensureConsolidadoBtn();

  const contentEl=document.getElementById('content');
  const detalleEl=document.getElementById('content-detalle');

  if(tab==='detalle'){
    contentEl.style.display='none';
    detalleEl.style.display='';
    if(!document.getElementById('det-wrap')){
      detalleEl.innerHTML=renderDetalle();
      _initDetalleListeners();
      _rebuildDetalleTable();
    } else {
      // DOM existe — solo asegurar btn consolidado y restaurar estado expandido
      _ensureConsolidadoBtn();
      // Si el mes activo cambió desde la última vez que se renderizó, reconstruir
      const lastMes=detalleEl.dataset.lastMes;
      const curMes=ST.consolidado?'__consolidado__':(ST.currentMes||ST.meses[0]);
      if(lastMes!==curMes) _rebuildDetalleTable();
      // else: DOM intacto, expandedSecs ya están en el DOM, no hacer nada
    }
  } else {
    contentEl.style.display='';
    detalleEl.style.display='none';
    renderCurrentTab();
  }
}

function switchMes(mes){
