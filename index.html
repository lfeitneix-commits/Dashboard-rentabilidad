// ── EXPORT XLSX ─────────────────────────────────────────────────
function exportDetalle(){
  const consBtn=document.getElementById('cons-btn');
  const isConsActive=consBtn&&consBtn.classList.contains('active');
  const mes=isConsActive?'Consolidado':(ST.currentMes||ST.meses[0]);
  if(typeof XLSX==='undefined'){alert('Exportación no disponible');return;}

  const tipoEl=document.getElementById('det-tipo');
  const areaEl=document.getElementById('det-area');
  const searchEl=document.getElementById('det-search');
  const tipoF=tipoEl?tipoEl.value:'Todos los tipos';
  const areaF=areaEl?areaEl.value:'Todas las áreas';
  const searchQ=searchEl?searchEl.value:'';
  const showAreas=areaF&&areaF!=='Todas las áreas'?[areaF]:AREAS;
  const tipoMap={'Facturación':'ing','Gastos directos':'dir','Gastos indirectos':'ind'};
  const tipoFilter=tipoF&&tipoF!=='Todos los tipos'?tipoMap[tipoF]:null;
  const q=searchQ.toLowerCase().trim();

  // Get data source
  // If consolidado: export consolidado sheet + one sheet per month
  const meses=isConsActive?['__consolidado__',...ST.meses]:[mes];

  const wb=XLSX.utils.book_new();

  meses.forEach(m=>{
    const d=m==='__consolidado__'?getConsolidadoDetalle():ST.mesData[m];
    if(!d) return;
    // d.agg de getConsolidadoDetalle() es el de un solo mes (queda pegado
    // por el spread de "base") -- para el resultado solo-directos hay que
    // usar el agg consolidado real, sumado entre todos los meses.
    const aggExport=m==='__consolidado__'?getAgg():d.agg;

    // Re-order rows same as buildDetalleTable (subsection headers before items)
    const finalRows=[];
    let k=0;
    while(k<d.annotated.length){
      const row=d.annotated[k];
      if(row._kind==='skip'){k++;continue;}
      if(row._kind!=='section'){finalRows.push(row);k++;continue;}
      finalRows.push(row);k++;
      const sectionContent=[];
      while(k<d.annotated.length&&d.annotated[k]._kind!=='section'){
        if(d.annotated[k]._kind!=='skip') sectionContent.push(d.annotated[k]);
        k++;
      }
      const groups=[];let currentItems=[];
      sectionContent.forEach(r=>{
        if(r._kind==='subsection'){groups.push({subsec:r,items:currentItems});currentItems=[];}
        else currentItems.push(r);
      });
      if(currentItems.length) groups.push({subsec:null,items:currentItems});
      const addedSubsecs=new Set();
      groups.forEach(g=>{
        const hasItems=g.items.length>0;
        const hasVals=g.subsec&&AREAS.some(a=>getAreaVal(g.subsec,a)!==0);
        if(g.subsec&&(hasItems||hasVals)){
          // Deduplicate subsections by label within this section
          if(!addedSubsecs.has(g.subsec._seclabel)){
            addedSubsecs.add(g.subsec._seclabel);
            finalRows.push(g.subsec);
          }
        }
        g.items.forEach(r=>finalRows.push(r));
      });
    }

    // Build rows
    const headers=['N° Cta','Nombre de cuenta',...showAreas,'Total USD','Notas'];
    const data=[headers];
    const rowMeta=[{type:'header'}]; // track row types for styling

    // Para un líder de área todavía no se exportan los indirectos (ver el
    // mismo criterio en buildDetalleTable).
    const ocultarIndirectosExp=ST.role==='lideres';
    let sectionVisible=!tipoFilter;

    finalRows.forEach(row=>{
      if(!row||row._kind==='skip') return;
      if(row._kind==='section'){
        sectionVisible=(!tipoFilter||row._tipo===tipoFilter)&&!(ocultarIndirectosExp&&row._tipo==='ind');
        if(!sectionVisible) return;
        const vals=showAreas.map(a=>getAreaVal(row,a));
        const tot=vals.reduce((s,v)=>s+v,0);
        data.push(['', row._seclabel.toUpperCase(), ...vals.map(v=>v||''), tot||'', '']);
        rowMeta.push({type:'section'});
        return;
      }
      if(row._kind==='subsection'){
        if(!sectionVisible) return;
        const vals=showAreas.map(a=>getAreaVal(row,a));
        const tot=vals.reduce((s,v)=>s+v,0);
        data.push(['', '  '+row._seclabel, ...vals.map(v=>v||''), tot||'', '']);
        rowMeta.push({type:'subsection'});
        return;
      }
      if(!sectionVisible) return;
      if(q){const h=(row._nom+' '+(row._num||'')).toLowerCase();if(!h.includes(q))return;}
      const vals=showAreas.map(a=>getAreaVal(row,a));
      const tot=AREAS.reduce((s,a)=>showAreas.includes(a)?s+getAreaVal(row,a):s,0);
      const indent=row._child?'      ':row._parent?'    ':'    ';
      const notaExport=notaLiderSegura(row,d.annotated,m==='__consolidado__',m);
      data.push([row._num||'', indent+row._nom, ...vals.map(v=>v||''), tot||'', notaExport]);
      rowMeta.push({type:row._child?'child':row._parent?'parent':'account'});
    });

    if(ocultarIndirectosExp){
      // Sin indirectos todavía: el total de gastos y el resultado se
      // exportan solo con gastos directos (agg ya viene calculado así,
      // ver buildAgg).
      if(!tipoFilter&&!q){
        const gVals=showAreas.map(a=>aggExport[a]?.gastos_dir||0);
        const gTot=gVals.reduce((s,v)=>s+v,0);
        data.push(['','TOTAL GASTOS DIRECTOS',...gVals.map(v=>v||''),gTot||'','']);
        rowMeta.push({type:'total'});
        const rVals=showAreas.map(a=>aggExport[a]?.resultado||0);
        const rTot=rVals.reduce((s,v)=>s+v,0);
        data.push(['','RESULTADO (solo gastos directos)',...rVals.map(v=>v||''),rTot||'','']);
        rowMeta.push({type:'resultado'});
      }
    } else {
      // Total gastos row
      const totalRow=d.annotated.find(r=>r._kind==='skip'&&/GASTOS.*TOTALES.*POR.*[AÁ]REA/i.test(r._nom));
      if(totalRow&&!tipoFilter&&!q){
        const tVals=showAreas.map(a=>getAreaVal(totalRow,a));
        const tTot=tVals.reduce((s,v)=>s+v,0);
        data.push(['','TOTAL GASTOS POR ÁREA',...tVals.map(v=>v||''),tTot||'','']);
        rowMeta.push({type:'total'});
      }
      // Resultado row
      const factRow=d.annotated.find(r=>r._kind==='section'&&r._tipo==='ing');
      if(factRow&&totalRow&&!tipoFilter&&!q){
        const rVals=showAreas.map(a=>getAreaVal(factRow,a)-getAreaVal(totalRow,a));
        const rTot=rVals.reduce((s,v)=>s+v,0);
        data.push(['','RESULTADO',...rVals.map(v=>v||''),rTot||'','']);
        rowMeta.push({type:'resultado'});
      }
    }

    const ws=XLSX.utils.aoa_to_sheet(data);

    // Column widths
    ws['!cols']=[{wch:11},{wch:40},...showAreas.map(()=>({wch:20})),{wch:16},{wch:45}];

    // Row heights
    ws['!rows']=rowMeta.map(r=>({
      hpt: r.type==='header'?20:r.type==='section'?16:r.type==='total'||r.type==='resultado'?16:14
    }));

    // Freeze top row
    ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activeCell:'A2',sqref:'A2'};



    const sheetName=m==='__consolidado__'?'Consolidado':m;
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });

  XLSX.writeFile(wb,'cuentas_'+mes+'.xlsx');
}

function exportRubrosRanking(){
  if(typeof XLSX==='undefined'){alert('Exportación no disponible');return;}
  const mes=ST.consolidado?'__consolidado__':(ST.currentMes||ST.meses[0]);
  const label=ST.consolidado?'Consolidado':mes;
  const sel=document.getElementById('rubros-cat');
  const cat=sel?sel.value:'';
  const ordSel=document.getElementById('rubros-orden');
  const orden=ordSel?ordSel.value:'monto';
  const full=getClasifRubrosRanking(mes);
  const totalGasto=full.reduce((s,r)=>s+r.monto,0);
  let ranking=(!cat||cat==='Todas las categorías')?full:full.filter(r=>r.cat===cat);
  if(orden==='categoria'){
    ranking=[...ranking].sort((a,b)=>(RUBRO_CAT_ORDEN[a.cat]??9)-(RUBRO_CAT_ORDEN[b.cat]??9)||b.monto-a.monto);
  }
  const data=[['Rubro','Categoría','Monto USD','% del total']];
  ranking.forEach(r=>data.push([r.nombre,r.cat||'',+r.monto.toFixed(2),totalGasto?+(r.monto/totalGasto*100).toFixed(1):0]));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb,ws,'Rubros');
  XLSX.writeFile(wb,`principales_rubros_${label}.xlsx`);
}

function exportGastosFijosDetalle(){
  if(typeof XLSX==='undefined'){alert('Exportación no disponible');return;}
  const d=currentGfdData();
  if(!d) return;
  const searchEl=document.getElementById('gfd-search');
  const query=normSearch(searchEl?searchEl.value:'').trim();
  const {valCols,cuentas,grandTotal}=d;
  const colIdxs=gfdVisibleColIdxs(valCols);
  const cols=colIdxs.map(i=>valCols[i]);
  const pick=vals=>colIdxs.map(i=>vals[i]);
  const data=[['Cuenta / Proveedor',...cols]];
  cuentas.forEach(c=>{
    const cuentaMatches=query&&normSearch(c.nombre).includes(query);
    const providers=(!query||cuentaMatches)?c.providers:c.providers.filter(p=>normSearch(p.nombre).includes(query));
    if(query&&!cuentaMatches&&!providers.length) return;
    const totalVals=pick(c.total?c.total.vals:valCols.map(()=>0));
    data.push([c.nombre,...totalVals]);
    providers.forEach(p=>data.push(['  '+p.nombre,...pick(p.vals)]));
    if(c.ajuste&&(!query||cuentaMatches)) data.push(['  '+c.ajuste.label,...pick(c.ajuste.vals)]);
  });
  if(!query&&grandTotal) data.push([grandTotal.label,...pick(grandTotal.vals)]);
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb,ws,'Gastos Fijos');
  XLSX.writeFile(wb,'gastos_fijos_proveedor.xlsx');
}

  }

// ── FETCH HELPERS ────────────────────────────────────────────────
function repairMojibake(s){
  // Google Sheets CSV sometimes double-encodes UTF-8 as latin-1
  // Fix the most common Spanish/Argentine chars
  return s
    .replace(/NÂº/g,'Nº').replace(/Âº/g,'º').replace(/Â°/g,'°')
    .replace(/Ã'/g,'Ñ').replace(/Ã±/g,'ñ')
    .replace(/Ã"/g,'Ó').replace(/Ã³/g,'ó')
    .replace(/Ã/g,'Á').replace(/Ã¡/g,'á')
    .replace(/Ã‰/g,'É').replace(/Ã©/g,'é')
    .replace(/Ã/g,'Í').replace(/Ã­/g,'í')
    .replace(/Ãš/g,'Ú').replace(/Ãº/g,'ú')
    .replace(/Ã€/g,'À').replace(/Ã /g,'à')
    .replace(/Ã¼/g,'ü').replace(/Ã¤/g,'ä')
    .replace(/Â¿/g,'¿').replace(/Â¡/g,'¡');
}

// Sin timeout, un fetch que se cuelga (típico de redes corporativas que
// dropean paquetes en vez de rechazar la conexión) deja loadData()
// esperando para siempre — pantalla en blanco sin ningún error visible.
async function fetchCSV(url,retries=2){
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),20000);
  try{
    const r = await fetch(url,{signal:controller.signal});
    if(!r.ok) throw new Error('HTTP '+r.status+' — '+url);
    const buf = await r.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    // If mojibake detected, repair
    if(text.includes('Ã')||text.includes('NÂ')) text = repairMojibake(text);
    return text;
  }catch(e){
    // Google Sheets a veces corta/rate-limitea alguna de las hojas cuando se
    // piden varias en simultáneo — un reintento corto suele resolverlo solo,
    // en vez de que esa hoja desaparezca en silencio.
    if(retries>0){
      await new Promise(res=>setTimeout(res,1200));
      return fetchCSV(url,retries-1);
    }
    if(e.name==='AbortError') throw new Error('Tiempo de espera agotado (20s) al pedir '+url);
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
}

// ── LOAD DATA ────────────────────────────────────────────────────
async function loadData(){
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spin');
  document.getElementById('sdot').style.background='var(--arena)';
  document.getElementById('stxt').textContent='Cargando…';
  const ts='&t='+Date.now();
  try{
    // Fetch with explicit UTF-8 to avoid mojibake on special chars (Nº etc.)
    // Main sheets + matriz in parallel
    const fetches=[
      ...SHEETS.map(s=>fetchCSV(BASE+s.gid+ts).catch(e=>({_err:e.message}))),
      fetchCSV(BASE+MATRIZ_GID+ts).catch(()=>null),
      fetchCSV(BASE+CAPN_GID+ts).catch(()=>null),
      fetchCSV(BASE+CLASIF_GID+ts).catch(e=>{console.error('CLASIF:',e);return null;}),
      ACLARACION_CUENTAS_GID?fetchCSV(BASE+ACLARACION_CUENTAS_GID+ts).catch(e=>{console.error('ACLARACION:',e);return null;}):Promise.resolve(null),
    ];
    const results=await Promise.allSettled(fetches);
    let loaded=0;
    // Process main sheets
    results.slice(0,SHEETS.length).forEach((res,i)=>{
      const val = res.status==='fulfilled' ? res.value : null;
      if(val && !val._err){
        const{headers,rows:rowsRaw}=parseCSV(val);
        // Cortar todo lo que venga después de "GASTOS TOTALES" (fila de cierre del
        // EERR) — lo que sigue en la hoja son datos contables/de caja aparte, que
        // sin este corte quedaban cayendo sueltos dentro de Gastos Indirectos.
        const gastosTotalesIdx=rowsRaw.findIndex(r=>/GASTOS?\s+TOTALES?/i.test(String(r[headers[0]]||'').trim()));
        const rows=gastosTotalesIdx>=0?rowsRaw.slice(0,gastosTotalesIdx+1):rowsRaw;
        if(rows.length){
          // New structure: col0=nombre (header vacío), then area columns, then Total, then Notas
          const numCol  = null;
          const nameCol = headers[0]; // vacío '' — nombre de fila está bajo esta key
          const notesCol= headers.find(h=>/nota/i.test(h))||headers.find(h=>/^_col/.test(h))||null;
          // totalGastosCell: sum SUBTOTAL DIRECTOS + GASTOS INDIRECTOS for areas sin CapN
          // Computed after annotateRows
          const annotated=annotateRows(rows,nameCol,numCol,notesCol);
          const subtotalRow=annotated.find(r=>r._kind==='subtotal_dir'&&/^SUBTOTAL\s+DIRECTOS$/i.test(r._nom));
          const indirectosRow=annotated.find(r=>r._kind==='section'&&/^GASTOS\s+INDIRECTOS$/i.test(r._nom));
          const impuestosRow=annotated.find(r=>r._kind==='skip'&&/^Impuestos$/i.test(r._nom));
          const totalGastosCell=(subtotalRow&&indirectosRow)
            ? AREAS.reduce((s,a)=>s+getAreaVal(subtotalRow,a)+getAreaVal(indirectosRow,a),0)
            : null;
          // Also store result rows for detalle display
          const resAntesRow=annotated.find(r=>r._kind==='skip'&&/RESULTADO.*antes.*impuesto/i.test(r._nom));
          const resDespuesRow=annotated.find(r=>r._kind==='skip'&&/RESULTADO.*despu/i.test(r._nom));
          const gastosTotalesRow=annotated.find(r=>r._kind==='skip'&&/^GASTOS?\s+TOTALES?$/i.test(r._nom));
          ST.mesData[SHEETS[i].mes]={
            agg:buildAgg(rows,nameCol,numCol,notesCol),
            annotated,
            nameCol,numCol,notesCol,headers,rows,
            totalGastosCell,subtotalRow,indirectosRow,impuestosRow,resAntesRow,resDespuesRow,gastosTotalesRow,
          };
          if(!ST.meses.includes(SHEETS[i].mes)) ST.meses.push(SHEETS[i].mes);
          loaded++;
        }
      }
    });
    // Process matriz
    const matrizResult=results[SHEETS.length];
    if(matrizResult.status==='fulfilled'&&matrizResult.value){
      const{rows,headers}=parseCSV(matrizResult.value);
      ST.matrizData=rows;
      ST.matrizCols=headers.filter(h=>h!==''&&!/^total$/i.test(h)&&!/^detalle$/i.test(h));
    }else{
      ST.matrizError='No se pudo cargar la hoja Matriz de gastos';
    }
    // Process clasificación sheet
    const clasifResult=results[SHEETS.length+2];
    if(clasifResult&&clasifResult.status==='fulfilled'&&clasifResult.value){
      const{rows:clasifRows,headers:clasifHeaders}=parseCSV(clasifResult.value);
      ST.clasifData={};
      const normMes=m=>m.charAt(0).toUpperCase()+m.slice(1).toLowerCase();
      const normLabel=s=>String(s||'').toUpperCase().replace(/[-\s]/g,'');
      const fijoRow=clasifRows.find(r=>normLabel(r[clasifHeaders[0]]).includes('GASTOSFIJOS'));
      const semiRow=clasifRows.find(r=>normLabel(r[clasifHeaders[0]]).includes('SEMIFIJOS'));
      const varRow=clasifRows.find(r=>normLabel(r[clasifHeaders[0]]).includes('GASTOSVARIABLES'));
      clasifHeaders.slice(1).forEach(m=>{
        if(!m) return;
        const mNorm=normMes(m.trim());
        ST.clasifData[mNorm]={
          fijos:fijoRow?parseNum(fijoRow[m]||''):0,
          semifijos:semiRow?parseNum(semiRow[m]||''):0,
          variables:varRow?parseNum(varRow[m]||''):0,
        };
      });
      const totFijos=Object.values(ST.clasifData).reduce((s,v)=>s+v.fijos,0);
      const totSemifijos=Object.values(ST.clasifData).reduce((s,v)=>s+v.semifijos,0);
      const totVars=Object.values(ST.clasifData).reduce((s,v)=>s+v.variables,0);
      ST.clasifData['__consolidado__']={fijos:totFijos,semifijos:totSemifijos,variables:totVars};
      ST.clasifRubros=parseClasificacionRubros(clasifResult.value);
      _categoriaPorCuentaCache=null;
    }
    const aclaracionResult=results[SHEETS.length+3];
    if(aclaracionResult&&aclaracionResult.status==='fulfilled'&&aclaracionResult.value){
      ST.aclaracionCuentas=parseAclaracionCuentas(aclaracionResult.value);
    }
    // Process CapN sheet
    const capnResult=results[SHEETS.length+1];
    if(capnResult&&capnResult.status==='fulfilled'&&capnResult.value){
      const{headers,rows}=parseCSV(capnResult.value);
      ST.capnData={headers,rows};
    }
    if(!loaded)throw new Error('Ninguna hoja devolvió datos');
    if(!ST.currentMes) ST.currentMes=ST.meses[0];
    // Month tabs
    const tabsEl=document.getElementById('month-tabs');tabsEl.innerHTML='';
    ST.meses.forEach(m=>{
      const el=document.createElement('div');
      el.className='mtab'+(m===ST.currentMes?' active':'');
      el.dataset.mes=m;el.textContent=m;
      el.addEventListener('click',()=>switchMes(m));
      tabsEl.appendChild(el);
    });

    const faltantes=SHEETS.filter(s=>!ST.meses.includes(s.mes)).map(s=>s.mes);
    if(faltantes.length||!ST.matrizData||!ST.capnData){
      document.getElementById('sdot').style.background='#AB1930';
      const partes=[];
      if(faltantes.length) partes.push('falta '+faltantes.join(', '));
      if(!ST.matrizData) partes.push('sin Matriz de gastos');
      if(!ST.capnData) partes.push('sin Capital N');
      document.getElementById('stxt').textContent=`${loaded}/${SHEETS.length} · ${partes.join(' · ')}`;
    } else {
      document.getElementById('sdot').style.background='#004836';
      document.getElementById('stxt').textContent=`${loaded}/${SHEETS.length} · ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;
    }
    renderCurrentTab();
  }catch(err){
    document.getElementById('sdot').style.background='#AB1930';
    document.getElementById('stxt').textContent='Error de conexión';
    document.getElementById('content').innerHTML=`<div class="state">
      <div style="font-size:24px">⚠</div>
      <div class="state-msg" style="margin-bottom:8px">Error al cargar datos</div>
      <div style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;max-width:400px;text-align:center;word-break:break-all">${err.message}</div>
      <button onclick="loadData()" style="margin-top:16px;padding:8px 20px;background:var(--bordeaux);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif">Reintentar</button>
    </div>`;
  }finally{btn.classList.remove('spin');}
}
